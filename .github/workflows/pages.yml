name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Ändringar i termdatan och byggkedjan deployas av deck.yml, efter att
    # tools/check_data.py har validerat dem. Utan den här listan skulle en
    # push-triggad deploy publicera osynkad data förbi valideringen.
    paths-ignore:
      - 'index.html'
      - 'data/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/deck.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
