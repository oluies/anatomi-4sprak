name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Ren avdubblering, inte en säkerhetsgräns: korrektheten ligger i
    # validate-jobbet nedan, som varje deploy passerar oavsett trigger.
    paths-ignore:
      # Speglar deck.yml:s paths exakt — de pushar deployas av deck.yml efter
      # att decket byggts om, annars publiceras det gamla decket.
      - 'data/anatomi-termer.json'
      - 'index.html'
      - 'tools/build_deck.py'
      - 'tools/check_data.py'
      - 'requirements.txt'
      - '.github/workflows/deck.yml'
      # Rör inte det som publiceras — ingen deploy behövs alls.
      - 'tests/**'
      - 'tools/verify_app.mjs'
      - 'tools/sync_html_data.py'
      - 'requirements-dev.txt'
      - '.github/workflows/ci.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Grinden ligger i deployen själv, inte i triggerfiltren, så att ingen väg
  # in i det här workflowet kan publicera osynkad termdata.
  validate:
    runs-on: ubuntu-latest
    outputs:
      # deploy checkar ut exakt den commit som validerats. Utan det kan grenen
      # ha flyttat sig mellan jobben — till exempel av deck.yml:s egen push —
      # och deployen publicera ett träd som aldrig kontrollerats.
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate term data and index.html sync
        run: python tools/check_data.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
