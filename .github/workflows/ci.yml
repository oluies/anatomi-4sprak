name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate term data and index.html sync
        run: |
          python tools/sync_html_data.py --check
          python tools/check_data.py

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build deck (rökprov)
        run: python tools/build_deck.py --out /tmp/smoke.apkg

      - name: Check JavaScript syntax
        run: node --check sw.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify index.html in a headless browser
        run: node tools/verify_app.mjs .
