<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomi och fysiologi — flashcards (sv / la / uk / ru)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<script>
/* Körs före sidan målas upp: annars hinner fel tema synas som en blink. Måste
   ligga här, inte i huvudskriptet längst ned. */
(function(){
  try{
    var t=localStorage.getItem("tema");
    if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  }catch(e){/* localStorage kan vara avstängt — då gäller systemets tema */}
})();
</script>
<style>
/* Paletterna står en gång var; blocken nedan väljer bara vilken som gäller.
   Utan data-theme följer sidan systemet, annars vinner det valda temat. */
:root{
  --d-bg:#0f1216; --d-panel:#171b21; --d-panel2:#1e242c; --d-line:#2a323c;
  --d-fg:#e8ecf1; --d-muted:#9aa6b4; --d-accent:#5aa9e6; --d-good:#4caf7d; --d-bad:#d4736b;
  --l-bg:#f6f7f9; --l-panel:#ffffff; --l-panel2:#eef1f5; --l-line:#d8dee6;
  --l-fg:#141a20; --l-muted:#5b6673; --l-accent:#1f6fb2; --l-good:#2f7d55; --l-bad:#a8443b;
  --radius:10px;

  color-scheme:dark;
  --bg:var(--d-bg); --panel:var(--d-panel); --panel2:var(--d-panel2); --line:var(--d-line);
  --fg:var(--d-fg); --muted:var(--d-muted); --accent:var(--d-accent);
  --good:var(--d-good); --bad:var(--d-bad);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    color-scheme:light;
    --bg:var(--l-bg); --panel:var(--l-panel); --panel2:var(--l-panel2); --line:var(--l-line);
    --fg:var(--l-fg); --muted:var(--l-muted); --accent:var(--l-accent);
    --good:var(--l-good); --bad:var(--l-bad);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:var(--l-bg); --panel:var(--l-panel); --panel2:var(--l-panel2); --line:var(--l-line);
  --fg:var(--l-fg); --muted:var(--l-muted); --accent:var(--l-accent);
  --good:var(--l-good); --bad:var(--l-bad);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:var(--d-bg); --panel:var(--d-panel); --panel2:var(--d-panel2); --line:var(--d-line);
  --fg:var(--d-fg); --muted:var(--d-muted); --accent:var(--d-accent);
  --good:var(--d-good); --bad:var(--d-bad);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:10}
h1{font-size:17px;font-weight:600;margin:0 0 10px}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row + .row{margin-top:8px}
label{font-size:13px;color:var(--muted)}
select,input[type=text],button{font:inherit;color:var(--fg);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel2);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;
  text-align:center;cursor:pointer}
.front{font-size:30px;font-weight:600;line-height:1.25}
.frontlang{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.answers{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
.ans{display:flex;gap:10px;padding:5px 0;align-items:baseline}
.tag{flex:0 0 34px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.ansval{font-size:19px}
.def{margin-top:12px;font-size:14.5px;color:var(--muted)}
.cat{font-size:12px;color:var(--muted);margin-top:14px}
.hint{color:var(--muted);font-size:13px;margin-top:14px;text-align:center}
.controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.controls button{padding:9px 18px}
.stats{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:var(--panel2)}
.qopt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px}
.qopt.right{background:var(--good);border-color:var(--good);color:#fff}
.qopt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.hidden{display:none}
#help{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
#help.hidden{display:none}
.helpbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  max-width:640px;width:100%;padding:20px 22px}
.helphead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:6px}
.helphead h2{font-size:17px;margin:0}
#helpclose{font-size:20px;line-height:1;padding:2px 10px}
#helpbody h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:18px 0 8px;font-weight:600}
#helpbody p{margin:0 0 8px;font-size:14.5px}
#helpbody ul{margin:0;padding-left:18px;font-size:14.5px}
#helpbody li{margin:4px 0}
.keytable{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;
  font-size:14.5px}
.keycap{font:600 12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:1px 8px;white-space:nowrap;justify-self:start}
/* Genvägarna visas bara där det finns tangentbord — på pekskärm är raden brus. */
.keys{display:none}
@media (hover:hover) and (pointer:fine){
  .keys{display:block;text-align:center;margin-top:12px;font-size:12px;color:var(--muted)}
}
.termimg{margin-top:16px;text-align:center}
.termimg img{max-width:100%;max-height:230px;border-radius:8px;background:#fff}
.imgcred{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45;
  max-width:520px;margin-left:auto;margin-right:auto;overflow-wrap:anywhere}
.imgcred a{color:var(--muted)}
#qimg img{max-width:100%;max-height:260px;border-radius:8px;background:#fff}
.report{margin-top:14px;text-align:center;font-size:12px}
.report a{color:var(--muted)}
@media (max-width:700px){ .termimg img{max-height:170px} #qimg img{max-height:190px} }
footer{color:var(--muted);font-size:12.5px;padding:24px 18px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
footer a{color:var(--accent)}
.footlinks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:12px}
#footmeta{margin-top:12px;font-size:12px;line-height:1.6;opacity:.85;
  max-width:620px;margin-left:auto;margin-right:auto}

/* Hopfällbara urvalsinställningar. På telefon tar de annars nästan hela skärmen
   innan man ens ser ett kort, så där är de hopfällda från start. */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titlerow h1{margin:0}
#togglesettings{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:5px 11px;
  white-space:nowrap}
#togglesettings .chev{font-size:10px;line-height:1;transition:transform .15s ease}
#togglesettings[aria-expanded="false"] .chev{transform:rotate(-90deg)}
#settings{margin-top:10px}
#cats{max-height:none;overflow:visible}
#summary{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.5;cursor:pointer}
#summary b{color:var(--fg);font-weight:600}
#summary .sep{opacity:.5;margin:0 6px}

@media (max-width:700px){
  header{padding:10px 14px}
  .wrap{padding:14px}
  h1{font-size:16px}
  .row{gap:8px}
  .seg button{padding:6px 10px;font-size:13.5px}
  /* Kategorilistan är 16 chips lång — låt den rulla i stället för att trycka
     ned kortet under skärmkanten när panelen är utfälld. */
  #cats{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card{min-height:210px;padding:22px 18px}
  .front{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <div class="titlerow">
      <h1 id="title">Anatomi och fysiologi</h1>
      <div class="row" style="gap:8px">
        <button id="togglesettings" aria-expanded="true" aria-controls="settings">
          <span data-i18n="b_settings">Inställningar</span><span class="chev">▼</span>
        </button>
        <button id="themebtn"></button>
        <button id="helpbtn" aria-haspopup="dialog" aria-controls="help" aria-expanded="false">?</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="seg" id="modes">
        <button data-mode="card" class="on" data-i18n="m_card">Flashcards</button>
        <button data-mode="quiz" data-i18n="m_quiz">Quiz</button>
        <button data-mode="image" data-i18n="m_image">Bildquiz</button>
        <button data-mode="list" data-i18n="m_list">Lista</button>
      </div>
    </div>
    <div id="settings">
      <div class="row">
        <label data-i18n="l_front">Fråga</label>
        <select id="front"></select>
        <label data-i18n="l_def">Förklaring</label>
        <select id="deflang"></select>
        <label data-i18n="l_ui">Gränssnitt</label>
        <select id="ui"></select>
      </div>
      <div class="row">
        <label data-i18n="l_back">Svar</label>
        <span id="backs" class="chips" style="margin-top:0"></span>
      </div>
      <div class="chips" id="cats"></div>
      <div class="row" style="margin-top:10px">
        <button id="allcats" data-i18n="b_all">Alla</button>
        <button id="nocats" data-i18n="b_none">Inga</button>
        <span id="count" style="font-size:13px;color:var(--muted)"></span>
      </div>
    </div>
    <div id="summary" class="hidden" role="button" tabindex="0"></div>
  </div>
</header>

<div class="wrap">
  <div id="view_card">
    <div class="card" id="card">
      <div>
        <div class="frontlang" id="flabel"></div>
        <div class="front" id="fterm"></div>
      </div>
      <div class="answers hidden" id="answers"></div>
      <div class="termimg hidden" id="cimg"></div>
      <div class="hint" id="hint" data-i18n="h_tap">Klicka eller tryck mellanslag för att vända</div>
    </div>

    <div class="controls">
      <button id="again" data-i18n="b_again">Repetera</button>
      <button id="known" class="primary" data-i18n="b_known">Kan</button>
      <button id="skip" data-i18n="b_skip">Hoppa över</button>
    </div>
    <div class="keys" id="keys" data-i18n="h_keys"></div>
    <div class="stats">
      <span><span data-i18n="s_seen">Visade</span>: <b id="s_seen">0</b></span>
      <span><span data-i18n="s_known">Kan</span>: <b id="s_known">0</b></span>
      <span><span data-i18n="s_left">Kvar</span>: <b id="s_left">0</b></span>
    </div>
  </div>

  <div id="view_quiz" class="hidden">
    <div class="card" style="cursor:default;min-height:auto;display:block;text-align:left">
      <div class="frontlang" id="qlabel"></div>
      <div class="front" id="qterm" style="text-align:left"></div>
      <div id="qopts" style="margin-top:18px"></div>
      <div class="def hidden" id="qdef"></div>
    </div>
    <div class="controls"><button id="qnext" class="primary" data-i18n="b_next">Nästa</button></div>
    <div class="stats">
      <span><span data-i18n="s_q">Frågor</span>: <b id="q_n">0</b></span>
      <span><span data-i18n="s_right">Rätt</span>: <b id="q_r">0</b></span>
    </div>
  </div>

  <div id="view_image" class="hidden">
    <div class="card" style="cursor:default;min-height:auto;display:block;text-align:center">
      <div class="frontlang" id="ilabel"></div>
      <div id="qimg"></div>
      <div class="imgcred" id="icred"></div>
      <div id="iopts" style="margin-top:18px;text-align:left"></div>
    </div>
    <div class="controls"><button id="inext" class="primary" data-i18n="b_next">Nästa</button></div>
    <div class="stats">
      <span><span data-i18n="s_q">Frågor</span>: <b id="i_n">0</b></span>
      <span><span data-i18n="s_right">Rätt</span>: <b id="i_r">0</b></span>
    </div>
  </div>

  <div id="view_list" class="hidden">
    <input type="text" id="search" placeholder="Sök..." style="width:100%">
    <div style="overflow-x:auto"><table id="tbl"></table></div>
  </div>

  <!-- Utanför lägesvyerna: rapportraden ska synas även i bildquizet, som är
       där en felaktig eller olämplig bild upptäcks. -->
  <div class="report" id="creport"></div>
</div>

<div id="help" class="hidden" role="dialog" aria-modal="true" aria-labelledby="help_h">
  <div class="helpbox">
    <div class="helphead">
      <h2 id="help_h"></h2>
      <button id="helpclose" aria-label="Stäng">×</button>
    </div>
    <div id="helpbody"></div>
  </div>
</div>

<footer>
  <span data-i18n="f_note">Termlista för grundläggande anatomi, fysiologi och medicinsk terminologi.</span>
  <span id="total"></span>
  <div class="footlinks">
    <a id="dl" href="data/anatomi-4sprak.apkg" download data-i18n="f_download">Ladda ner Anki-deck (.apkg)</a>
    <a href="https://github.com/oluies/anatomi-4sprak" data-i18n="f_source">Källkod på GitHub</a>
    <a href="https://donate.wikimedia.org/" rel="noopener" data-i18n="f_donate">Stöd Wikipedia</a>
  </div>
  <div id="footmeta"></div>
</footer>

(состояние мочи)","def_sv":"Ändelse som beskriver urinen eller urinmängden, till exempel polyuri.","def_uk":"Суфікс, що описує сечу або її кількість, наприклад поліурія.","def_ru":"Суффикс, описывающий мочу или её количество, например полиурия.","n":72},{"id":"a-an","cat":"Medicinsk terminologi","sv":"a-/an- (utan, brist på)","la":"a-/an-","uk":"а-/ан- (без, відсутність)","ru":"а-/ан- (без, отсутствие)","def_sv":"Förled som betyder utan eller avsaknad av något, till exempel anemi.","def_uk":"Префікс, що означає без або відсутність чогось, наприклад анемія.","def_ru":"Приставка, означающая без или отсутствие чего-либо, например анемия.","n":73},{"id":"brady","cat":"Medicinsk terminologi","sv":"brady- (långsam)","la":"brady-","uk":"браді- (повільний)","ru":"бради- (медленный)","def_sv":"Förled som betyder långsam, till exempel bradykardi som är låg puls.","def_uk":"Префікс, що означає повільний, наприклад брадикардія, тобто низький пульс.","def_ru":"Приставка, означающая медленный, например брадикардия, то есть низкий пульс.","n":74},{"id":"cardia","cat":"Medicinsk terminologi","sv":"hjärta","la":"cardia (kardio-)","uk":"серце (кардіо-)","ru":"сердце (кардио-)","def_sv":"Ordled som betyder hjärta, till exempel kardiologi, läran om hjärtat.","def_uk":"Корінь, що означає серце, наприклад кардіологія, наука про серце.","def_ru":"Корень, означающий сердце, например кардиология, наука о сердце.","n":75},{"id":"derma","cat":"Medicinsk terminologi","sv":"hud","la":"derma (dermato-)","uk":"шкіра (дермато-)","ru":"кожа (дермато-)","def_sv":"Ordled som betyder hud, till exempel dermatit, inflammation i huden.","def_uk":"Корінь, що означає шкіру, наприклад дерматит, запалення шкіри.","def_ru":"Корень, означающий кожу, например дерматит, воспаление кожи.","n":76},{"id":"dys","cat":"Medicinsk terminologi","sv":"dys- (svårighet, störd funktion)","la":"dys-","uk":"дис- (утруднення, порушення)","ru":"дис- (затруднение, нарушение)","def_sv":"Förled som betyder svårighet eller störd funktion, till exempel dysfagi.","def_uk":"Префікс, що означає утруднення або порушення функції, наприклад дисфагія.","def_ru":"Приставка, означающая затруднение или нарушение функции, например дисфагия.","n":77},{"id":"endo","cat":"Medicinsk terminologi","sv":"endo- (inuti, inne i)","la":"endo-","uk":"ендо- (усередині)","ru":"эндо- (внутри)","def_sv":"Förled som betyder inuti något, till exempel endokardium innerst i hjärtat.","def_uk":"Префікс, що означає усередині чогось, наприклад ендокард усередині серця.","def_ru":"Приставка, означающая внутри чего-либо, например эндокард внутри сердца.","n":78},{"id":"epi","cat":"Medicinsk terminologi","sv":"epi- (på, ovanpå)","la":"epi-","uk":"епі- (на, поверх)","ru":"эпи- (на, поверх)","def_sv":"Förled som betyder på eller ovanpå, till exempel epidermis ytterst i huden.","def_uk":"Префікс, що означає на або поверх, наприклад епідерміс, зовнішній шар шкіри.","def_ru":"Приставка, означающая на или поверх, например эпидермис, наружный слой кожи.","n":79},{"id":"gastro","cat":"Medicinsk terminologi","sv":"magsäck","la":"gaster (gastro-)","uk":"шлунок (гастро-)","ru":"желудок (гастро-)","def_sv":"Ordled som betyder magsäck, till exempel gastroskopi som undersöker magsäcken.","def_uk":"Корінь, що означає шлунок, наприклад гастроскопія, огляд шлунка.","def_ru":"Корень, означающий желудок, например гастроскопия, осмотр желудка.","n":80},{"id":"hepato","cat":"Medicinsk terminologi","sv":"lever","la":"hepar (hepato-)","uk":"печінка (гепато-)","ru":"печень (гепато-)","def_sv":"Ordled som betyder lever, till exempel hepatit, inflammation i levern.","def_uk":"Корінь, що означає печінку, наприклад гепатит, запалення печінки.","def_ru":"Корень, означающий печень, например гепатит, воспаление печени.","n":81},{"id":"hyper","cat":"Medicinsk terminologi","sv":"hyper- (över, förhöjd)","la":"hyper-","uk":"гіпер- (над, підвищений)","ru":"гипер- (над, повышенный)","def_sv":"Förled som betyder för mycket eller förhöjd, till exempel hypertoni.","def_uk":"Префікс, що означає надмірний або підвищений, наприклад гіпертонія.","def_ru":"Приставка, означающая избыточный или повышенный, например гипертония.","n":82},{"id":"hypo","cat":"Medicinsk terminologi","sv":"hypo- (under, sänkt)","la":"hypo-","uk":"гіпо- (під, знижений)","ru":"гипо- (под, пониженный)","def_sv":"Förled som betyder för lite eller sänkt, till exempel hypotoni.","def_uk":"Префікс, що означає недостатній або знижений, наприклад гіпотонія.","def_ru":"Приставка, означающая недостаточный или пониженный, например гипотония.","n":83},{"id":"inter","cat":"Medicinsk terminologi","sv":"inter- (mellan)","la":"inter-","uk":"інтер- (між)","ru":"интер- (между)","def_sv":"Förled som betyder mellan, till exempel interkostal som betyder mellan revbenen.","def_uk":"Префікс, що означає між, наприклад міжреберний, тобто між ребрами.","def_ru":"Приставка, означающая между, например межреберный, то есть между ребрами.","n":84},{"id":"intra","cat":"Medicinsk terminologi","sv":"intra- (inne i, inuti)","la":"intra-","uk":"інтра- (усередині)","ru":"интра- (внутри)","def_sv":"Förled som betyder inne i, till exempel intravenös inne i venen.","def_uk":"Префікс, що означає всередині, наприклад внутрішньовенний, тобто всередині вени.","def_ru":"Приставка, означающая внутри, например внутривенный, то есть внутри вены.","n":85},{"id":"nefro-reno","cat":"Medicinsk terminologi","sv":"njure","la":"nephros (nefro-) / ren (reno-)","uk":"нирка (нефро-, рено-)","ru":"почка (нефро-, рено-)","def_sv":"Ordled som betyder njure, till exempel nefrit, inflammation i njuren.","def_uk":"Корінь, що означає нирку, наприклад нефрит, запалення нирки.","def_ru":"Корень, означающий почку, например нефрит, воспаление почки.","n":86},{"id":"oligo","cat":"Medicinsk terminologi","sv":"oligo- (få, för lite)","la":"oligo-","uk":"оліго- (мало, недостатньо)","ru":"олиго- (мало, недостаточно)","def_sv":"Förled som betyder få eller för lite, till exempel oliguri.","def_uk":"Префікс, що означає мало або недостатньо, наприклад олігурія.","def_ru":"Приставка, означающая мало или недостаточно, например олигурия.","n":87},{"id":"osteo","cat":"Medicinsk terminologi","sv":"ben, benvävnad","la":"os (osteo-)","uk":"кістка (остео-)","ru":"кость (остео-)","def_sv":"Ordled som betyder ben eller benvävnad, till exempel osteoporos.","def_uk":"Корінь, що означає кістку або кісткову тканину, наприклад остеопороз.","def_ru":"Корень, означающий кость или костную ткань, например остеопороз.","n":88},{"id":"peri","cat":"Medicinsk terminologi","sv":"peri- (runt omkring)","la":"peri-","uk":"пери- (навколо)","ru":"пери- (вокруг)","def_sv":"Förled som betyder runt omkring något, till exempel perikardium runt hjärtat.","def_uk":"Префікс, що означає навколо чогось, наприклад перикард навколо серця.","def_ru":"Приставка, означающая вокруг чего-либо, например перикард вокруг сердца.","n":89},{"id":"poly","cat":"Medicinsk terminologi","sv":"poly- (många, mycket)","la":"poly-","uk":"полі- (багато)","ru":"поли- (много)","def_sv":"Förled som betyder många eller mycket, till exempel polyuri.","def_uk":"Префікс, що означає багато або надмірно, наприклад поліурія.","def_ru":"Приставка, означающая много или избыточно, например полиурия.","n":90},{"id":"post","cat":"Medicinsk terminologi","sv":"post- (efter)","la":"post-","uk":"пост- (після)","ru":"пост- (после)","def_sv":"Förled som betyder efter, till exempel postoperativ som betyder efter operation.","def_uk":"Префікс, що означає після, наприклад післяопераційний, тобто після операції.","def_ru":"Приставка, означающая после, например послеоперационный, то есть после операции.","n":91},{"id":"pre","cat":"Medicinsk terminologi","sv":"pre- (före)","la":"pre-/prae-","uk":"пре- (перед, до)","ru":"пре- (перед, до)","def_sv":"Förled som betyder före, till exempel preoperativ som betyder före operation.","def_uk":"Префікс, що означає до, наприклад передопераційний, тобто перед операцією.","def_ru":"Приставка, означающая до, например предоперационный, то есть перед операцией.","n":92},{"id":"pulmo","cat":"Medicinsk terminologi","sv":"lunga","la":"pulmo (pulmo-)","uk":"легеня (пульмо-)","ru":"лёгкое (пульмо-)","def_sv":"Ordled som betyder lunga, till exempel pulmonell som rör lungorna.","def_uk":"Корінь, що означає легеню, наприклад пульмональний, тобто легеневий.","def_ru":"Корень, означающий лёгкое, например пульмональный, то есть лёгочный.","n":93},{"id":"sub","cat":"Medicinsk terminologi","sv":"sub- (under, nedanför)","la":"sub-","uk":"суб- (під, нижче)","ru":"суб- (под, ниже)","def_sv":"Förled som betyder under, till exempel subkutan som betyder under huden.","def_uk":"Префікс, що означає під, наприклад підшкірний, тобто розташований під шкірою.","def_ru":"Приставка, означающая под, например подкожный, то есть расположенный под кожей.","n":94},{"id":"tachy","cat":"Medicinsk terminologi","sv":"taky- (snabb)","la":"tachy-","uk":"тахі- (швидкий)","ru":"тахи- (быстрый)","def_sv":"Förled som betyder snabb, till exempel takykardi som är hög puls.","def_uk":"Префікс, що означає швидкий, наприклад тахікардія, тобто високий пульс.","def_ru":"Приставка, означающая быстрый, например тахикардия, то есть высокий пульс.","n":95},{"id":"atlas","cat":"Skelettet","sv":"atlas (första halskotan)","la":"atlas","uk":"атлант","ru":"атлант","def_sv":"Atlas är första halskotan och bär upp huvudet.","def_uk":"Атлант - перший шийний хребець, який підтримує голову.","def_ru":"Атлант - первый шейный позвонок, который поддерживает голову.","n":96},{"id":"axis","cat":"Skelettet","sv":"axis (andra halskotan)","la":"axis","uk":"осьовий хребець (аксис)","ru":"осевой позвонок (аксис)","def_sv":"Axis är andra halskotan och gör att huvudet kan vridas.","def_uk":"Аксис - другий шийний хребець, що дозволяє повертати голову.","def_ru":"Аксис - второй шейный позвонок, позволяющий поворачивать голову.","n":97},{"id":"calcaneus","cat":"Skelettet","sv":"hälben","la":"calcaneus","uk":"п'яткова кістка","ru":"пяточная кость","def_sv":"Hälbenet är fotens största ben och bildar hälen.","def_uk":"П'яткова кістка - найбільша кістка стопи, утворює п'яту.","def_ru":"Пяточная кость - самая крупная кость стопы, образует пятку.","n":98},{"id":"cartilago","cat":"Skelettet","sv":"brosk","la":"cartilago","uk":"хрящ","ru":"хрящ","def_sv":"Brosk är en mjuk stödjevävnad som täcker ledytorna.","def_uk":"Хрящ - м'яка опорна тканина, що вкриває суглобові поверхні.","def_ru":"Хрящ - мягкая опорная ткань, покрывающая суставные поверхности.","n":99},{"id":"clavicula","cat":"Skelettet","sv":"nyckelben","la":"clavicula","uk":"ключиця","ru":"ключица","def_sv":"Nyckelbenet förbinder bröstbenet med skulderbladet.","def_uk":"Ключиця з'єднує грудину з лопаткою.","def_ru":"Ключица соединяет грудину с лопаткой.","n":100},{"id":"columna-vertebralis","cat":"Skelettet","sv":"ryggrad (kotpelare)","la":"columna vertebralis","uk":"хребет (хребтовий стовп)","ru":"позвоночник (позвоночный столб)","def_sv":"Ryggraden består av kotor, bär upp kroppen och skyddar ryggmärgen.","def_uk":"Хребет складається з хребців, підтримує тіло та захищає спинний мозок.","def_ru":"Позвоночник состоит из позвонков, поддерживает тело и защищает спинной мозг.","n":101},{"id":"costa","cat":"Skelettet","sv":"revben","la":"costa","uk":"ребро","ru":"ребро","def_sv":"Revbenen är tolv par böjda ben som skyddar brösthålans organ.","def_uk":"Ребра - дванадцять пар вигнутих кісток, що захищають органи грудної порожнини.","def_ru":"Рёбра - двенадцать пар изогнутых костей, защищающих органы грудной полости.","n":102},{"id":"cranium","cat":"Skelettet","sv":"kranium (skalle)","la":"cranium","uk":"череп","ru":"череп","def_sv":"Kraniet är skallens benstomme som skyddar hjärnan och sinnesorganen.","def_uk":"Череп - кісткова основа голови, що захищає мозок і органи чуття.","def_ru":"Череп - костная основа головы, защищающая мозг и органы чувств.","n":103},{"id":"discus-intervertebralis","cat":"Skelettet","sv":"mellankotskiva","la":"discus intervertebralis","uk":"міжхребцевий диск","ru":"межпозвонковый диск","def_sv":"Mellankotskivan ligger mellan kotorna och dämpar stötar.","def_uk":"Міжхребцевий диск лежить між хребцями та пом'якшує поштовхи.","def_ru":"Межпозвонковый диск лежит между позвонками и смягчает толчки.","n":104},{"id":"fibula","cat":"Skelettet","sv":"vadben","la":"fibula","uk":"малогомілкова кістка","ru":"малоберцовая кость","def_sv":"Vadbenet är underbenets smala ben på utsidan.","def_uk":"Малогомілкова кістка - тонка кістка гомілки із зовнішнього боку.","def_ru":"Малоберцовая кость - тонкая кость голени с наружной стороны.","n":105},{"id":"humerus","cat":"Skelettet","sv":"överarmsben","la":"humerus","uk":"плечова кістка","ru":"плечевая кость","def_sv":"Överarmsbenet går från axelleden ner till armbågsleden.","def_uk":"Плечова кістка йде від плечового суглоба до ліктьового.","def_ru":"Плечевая кость идёт от плечевого сустава до локтевого.","n":106},{"id":"mandibula","cat":"Skelettet","sv":"underkäke","la":"mandibula","uk":"нижня щелепа","ru":"нижняя челюсть","def_sv":"Underkäken är skallens enda rörliga ben och bär de nedre tänderna.","def_uk":"Нижня щелепа - єдина рухома кістка черепа, несе нижні зуби.","def_ru":"Нижняя челюсть - единственная подвижная кость черепа, несёт нижние зубы.","n":107},{"id":"maxilla","cat":"Skelettet","sv":"överkäksben","la":"maxilla","uk":"верхня щелепа","ru":"верхняя челюсть","def_sv":"Överkäksbenet bär de övre tänderna och bildar största delen av gommen.","def_uk":"Верхня щелепа несе верхні зуби й утворює більшу частину піднебіння.","def_ru":"Верхняя челюсть несёт верхние зубы и образует большую часть нёба.","n":108},{"id":"medulla-ossium","cat":"Skelettet","sv":"benmärg","la":"medulla ossium","uk":"кістковий мозок","ru":"костный мозг","def_sv":"Benmärgen finns inuti benen och bildar blodkroppar.","def_uk":"Кістковий мозок міститься всередині кісток і утворює клітини крові.","def_ru":"Костный мозг находится внутри костей и образует клетки крови.","n":109},{"id":"os-coccygis","cat":"Skelettet","sv":"svansben","la":"os coccygis","uk":"куприк","ru":"копчик","def_sv":"Svansbenet är ryggradens nedersta del med några små sammanvuxna kotor.","def_uk":"Куприк - нижня частина хребта з кількох дрібних зрослих хребців.","def_ru":"Копчик - нижняя часть позвоночника из нескольких мелких сросшихся позвонков.","n":110},{"id":"os-coxae","cat":"Skelettet","sv":"höftben","la":"os coxae","uk":"кульшова кістка","ru":"тазовая кость","def_sv":"Höftbenet består av tarmben, sittben och blygdben.","def_uk":"Кульшова кістка складається з клубової, сідничої та лобкової кісток.","def_ru":"Тазовая кость состоит из подвздошной, седалищной и лобковой костей.","n":111},{"id":"os-femoris","cat":"Skelettet","sv":"lårben","la":"os femoris","uk":"стегнова кістка","ru":"бедренная кость","def_sv":"Lårbenet är kroppens längsta och starkaste ben.","def_uk":"Стегнова кістка - найдовша й найміцніша кістка тіла.","def_ru":"Бедренная кость - самая длинная и прочная кость тела.","n":112},{"id":"os-frontale","cat":"Skelettet","sv":"pannben","la":"os frontale","uk":"лобова кістка","ru":"лобная кость","def_sv":"Pannbenet bildar pannan och främre delen av skallens tak.","def_uk":"Лобова кістка утворює чоло та передню частину склепіння черепа.","def_ru":"Лобная кость образует лоб и переднюю часть свода черепа.","n":113},{"id":"os-ilium","cat":"Skelettet","sv":"tarmben","la":"os ilium","uk":"клубова кістка","ru":"подвздошная кость","def_sv":"Tarmbenet är höftbenets breda övre del.","def_uk":"Клубова кістка - широка верхня частина кульшової кістки.","def_ru":"Подвздошная кость - широкая верхняя часть тазовой кости.","n":114},{"id":"os-ischii","cat":"Skelettet","sv":"sittben","la":"os ischii","uk":"сіднича кістка","ru":"седалищная кость","def_sv":"Sittbenet är höftbenets nedre bakre del som man sitter på.","def_uk":"Сіднича кістка - нижня задня частина кульшової кістки, на якій сидять.","def_ru":"Седалищная кость - нижняя задняя часть тазовой кости, на которой сидят.","n":115},{"id":"os-nasale","cat":"Skelettet","sv":"näsben","la är upp huvudet.","def_uk":"Шийних хребців сім, вони підтримують голову.","def_ru":"Шейных позвонков семь, они поддерживают голову.","n":139},{"id":"vertebra-lumbalis","cat":"Skelettet","sv":"ländkota","la":"vertebra lumbalis","uk":"поперековий хребець","ru":"поясничный позвонок","def_sv":"Ländkotorna är fem stycken och är ryggradens kraftigaste kotor.","def_uk":"Поперекових хребців п'ять, вони найміцніші хребці хребта.","def_ru":"Поясничных позвонков пять, они самые массивные позвонки позвоночника.","n":140},{"id":"vertebra-thoracica","cat":"Skelettet","sv":"bröstkota","la":"vertebra thoracica","uk":"грудний хребець","ru":"грудной позвонок","def_sv":"Bröstkotorna är tolv stycken och ledar mot revbenen.","def_uk":"Грудних хребців дванадцять, вони з'єднуються з ребрами.","def_ru":"Грудных позвонков двенадцать, они соединяются с рёбрами.","n":141},{"id":"abductio","cat":"Leder och muskler","sv":"abduktion (utåtföring)","la":"abductio","uk":"відведення (абдукція)","ru":"отведение (абдукция)","def_sv":"Abduktion är att föra en kroppsdel bort från kroppens mittlinje.","def_uk":"Відведення — це рух частини тіла від серединної лінії тіла.","def_ru":"Отведение — это движение части тела от срединной линии тела.","n":142},{"id":"adductio","cat":"Leder och muskler","sv":"adduktion (inåtföring)","la":"adductio","uk":"приведення (аддукція)","ru":"приведение (аддукция)","def_sv":"Adduktion är att föra en kroppsdel mot kroppens mittlinje.","def_uk":"Приведення — це рух частини тіла до серединної лінії тіла.","def_ru":"Приведение — это движение части тела к срединной линии тела.","n":143},{"id":"amphiarthrosis","cat":"Leder och muskler","sv":"amfiartros (halvrörlig fog)","la":"amphiarthrosis","uk":"амфіартроз (напіврухоме з'єднання)","ru":"амфиартроз (полуподвижное соединение)","def_sv":"En halvrörlig fog som bara tillåter små rörelser, till exempel mellan kotkropparna.","def_uk":"Напіврухоме з'єднання, яке допускає лише невеликі рухи, наприклад між тілами хребців.","def_ru":"Полуподвижное соединение, допускающее лишь небольшие движения, например между телами позвонков.","n":144},{"id":"articulatio","cat":"Leder och muskler","sv":"led","la":"articulatio","uk":"суглоб","ru":"сустав","def_sv":"En led är förbindelsen där två eller flera ben möts och rörelse sker.","def_uk":"Суглоб — це з'єднання, де сходяться дві або більше кісток і відбувається рух.","def_ru":"Сустав — это соединение, где сходятся две или более костей и происходит движение.","n":145},{"id":"articulatio-coxae","cat":"Leder och muskler","sv":"höftled","la":"articulatio coxae","uk":"кульшовий суглоб","ru":"тазобедренный сустав","def_sv":"Höftleden förbinder lårbenet med bäckenet och bär kroppens tyngd.","def_uk":"Кульшовий суглоб з'єднує стегнову кістку з тазом і несе вагу тіла.","def_ru":"Тазобедренный сустав соединяет бедренную кость с тазом и несёт вес тела.","n":146},{"id":"articulatio-cubiti","cat":"Leder och muskler","sv":"armbågsled","la":"articulatio cubiti","uk":"ліктьовий суглоб","ru":"локтевой сустав","def_sv":"Armbågsleden böjer och sträcker armen mellan överarm och underarm.","def_uk":"Ліктьовий суглоб згинає та розгинає руку між плечем і передпліччям.","def_ru":"Локтевой сустав сгибает и разгибает руку между плечом и предплечьем.","n":147},{"id":"articulatio-ellipsoidea","cat":"Leder och muskler","sv":"ellipsoidled (äggled)","la":"articulatio ellipsoidea","uk":"еліпсоподібний суглоб","ru":"эллипсовидный сустав","def_sv":"Led där en äggformad ledyta rör sig i en oval grop, som i handleden.","def_uk":"Суглоб, у якому яйцеподібна головка рухається в овальній ямці, як у променево-зап'ястковому суглобі.","def_ru":"Сустав, в котором яйцевидная головка движется в овальной ямке, как в лучезапястном суставе.","n":148},{"id":"articulatio-genus","cat":"Leder och muskler","sv":"knäled","la":"articulatio genus","uk":"колінний суглоб","ru":"коленный сустав","def_sv":"Knäleden ligger mellan lårben och skenben och böjer benet.","def_uk":"Колінний суглоб лежить між стегновою та великогомілковою кістками і згинає ногу.","def_ru":"Коленный сустав лежит между бедренной и большеберцовой костями и сгибает ногу.","n":149},{"id":"articulatio-humeri","cat":"Leder och muskler","sv":"axelled","la":"articulatio humeri","uk":"плечовий суглоб","ru":"плечевой сустав","def_sv":"Axelleden sitter mellan skulderbladet och överarmsbenet och rör sig åt alla håll.","def_uk":"Плечовий суглоб розташований між лопаткою та плечовою кісткою і рухається в усіх напрямках.","def_ru":"Плечевой сустав расположен между лопаткой и плечевой костью и движется во всех направлениях.","n":150},{"id":"articulatio-plana","cat":"Leder och muskler","sv":"planled (glidled)","la":"articulatio plana","uk":"плоский суглоб","ru":"плоский сустав","def_sv":"Led med nästan flata ledytor som glider mot varandra, till exempel mellan handlovsbenen.","def_uk":"Суглоб з майже рівними поверхнями, які ковзають одна по одній, наприклад між кістками зап'ястка.","def_ru":"Сустав с почти ровными поверхностями, скользящими друг по другу, например между костями запястья.","n":151},{"id":"articulatio-sellaris","cat":"Leder och muskler","sv":"sadelled","la":"articulatio sellaris","uk":"сідлоподібний суглоб","ru":"седловидный сустав","def_sv":"Led där båda ledytorna är sadelformade, som i tummens grundled.","def_uk":"Суглоб, де обидві поверхні мають форму сідла, як у суглобі великого пальця.","def_ru":"Сустав, где обе поверхности имеют форму седла, как в суставе большого пальца.","n":152},{"id":"articulatio-spheroidea","cat":"Leder och muskler","sv":"kulled","la":"articulatio spheroidea","uk":"кулястий суглоб","ru":"шаровидный сустав","def_sv":"Led där ett kulformat ledhuvud rör sig i en skål och tillåter rörelse åt alla håll, som i axelleden.","def_uk":"Суглоб, у якому куляста головка рухається в западині й дозволяє рухи в усіх напрямках, як у плечовому суглобі.","def_ru":"Сустав, в котором шаровидная головка движется во впадине и допускает движения во всех направлениях, как в плечевом суставе.","n":153},{"id":"articulatio-talocruralis","cat":"Leder och muskler","sv":"fotled (övre språngbensleden)","la":"articulatio talocruralis","uk":"надп'ятково-гомілковий суглоб","ru":"голеностопный сустав","def_sv":"Fotleden ligger mellan underbenet och språngbenet och lyfter foten.","def_uk":"Надп'ятково-гомілковий суглоб лежить між гомілкою та надп'ятковою кісткою і піднімає стопу.","def_ru":"Голеностопный сустав лежит между голенью и таранной костью и поднимает стопу.","n":154},{"id":"articulatio-trochoidea","cat":"Leder och muskler","sv":"vridled (trissled)","la":"articulatio trochoidea","uk":"обертовий суглоб","ru":"вращательный сустав","def_sv":"Led där ett ben roterar kring sin egen längdaxel, som mellan strålbenet och armbågsbenet.","def_uk":"Суглоб, у якому кістка обертається навколо власної поздовжньої осі, як між променевою та ліктьовою кістками.","def_ru":"Сустав, в котором кость вращается вокруг собственной продольной оси, как между лучевой и локтевой костями.","n":155},{"id":"bursa","cat":"Leder och muskler","sv":"slemsäck","la":"bursa","uk":"синовіальна сумка","ru":"синовиальная сумка","def_sv":"En slemsäck ligger som en dyna mellan sena och ben.","def_uk":"Синовіальна сумка лежить як подушка між сухожилком і кісткою.","def_ru":"Синовиальная сумка лежит как подушка между сухожилием и костью.","n":156},{"id":"capsula-articularis","cat":"Leder och muskler","sv":"ledkapsel","la":"capsula articularis","uk":"суглобова капсула","ru":"суставная капсула","def_sv":"Ledkapseln omsluter leden och håller ledvätskan på plats.","def_uk":"Суглобова капсула оточує суглоб і утримує синовіальну рідину на місці.","def_ru":"Суставная капсула окружает сустав и удерживает синовиальную жидкость на месте.","n":157},{"id":"cartilago-articularis","cat":"Leder och muskler","sv":"ledbrosk","la":"cartilago articularis","uk":"суглобовий хрящ","ru":"суставной хрящ","def_sv":"Ledbrosket täcker benändarna i leden och minskar friktion vid rörelse.","def_uk":"Суглобовий хрящ покриває кінці кісток у суглобі та зменшує тертя під час руху.","def_ru":"Суставной хрящ покрывает концы костей в суставе и уменьшает трение при движении.","n":158},{"id":"diaphragma","cat":"Leder och muskler","sv":"mellangärdet","la":"diaphragma","uk":"діафрагма","ru":"диафрагма","def_sv":"Mellangärdet skiljer bröstkorgen från buken och styr andningen.","def_uk":"Діафрагма відділяє грудну клітку від живота і керує диханням.","def_ru":"Диафрагма отделяет грудную клетку от живота и управляет дыханием.","n":159},{"id":"diarthrosis","cat":"Leder och muskler","sv":"diartros (fritt rörlig led)","la":"diarthrosis","uk":"діартроз (рухоме з'єднання)","ru":"диартроз (подвижное соединение)","def_sv":"En fritt rörlig led med ledhåla, ledkapsel och ledvätska, till exempel axelleden.","def_uk":"Вільно рухоме з'єднання із суглобовою порожниною, капсулою та синовіальною рідиною, наприклад плечовий суглоб.","def_ru":"Свободно подвижное соединение с суставной полостью, капсулой и синовиальной жидкостью, например плечевой сустав.","n":160},{"id":"extensio","cat":"Leder och muskler","sv":"extension (sträckning)","la":"extensio","uk":"розгинання (екстензія)","ru":"разгибание (экстензия)","def_sv":"Extension betyder att sträcka en kroppsdel så att vinkeln ökar.","def_uk":"Розгинання означає випрямляти частину тіла так, що кут збільшується.","def_ru":"Разгибание означает выпрямлять часть тела так, что угол увеличивается.","n":161},{"id":"flexio","cat":"Leder och muskler","sv":"flexion (böjning)","la":"flexio","uk":"згинання (флексія)","ru":"сгибание (флексия)","def_sv":"Flexion betyder att böja en kroppsdel så att vinkeln minskar.","def_uk":"Згинання означає згинати частину тіла так, що кут зменшується.","def_ru":"Сгибание означает сгибать часть тела так, что угол уменьшается.","n":162},{"id":"ginglymus","cat":"Leder och muskler","sv":"gångjärnsled","la":"ginglymus","uk":"блокоподібний суглоб","ru":"блоковидный сустав","def_sv":"Led som bara böjer och sträcker i ett plan, som armbågsleden.","def_uk":"Суглоб, який згинається і розгинається лише в одній площині, як ліктьовий суглоб.","def_ru":"Сустав, который сгибается и разгибается только в одной плоскости, как локтевой сустав.","n":163},{"id":"gomphosis","cat":"Leder och muskler","sv":"gomfos (tappfog)","la":"gomphosis","uk":"гомфоз (вклинення)","ru":"гомфоз (вколачивание)","def_sv":"Fog där en tand sitter fast i sitt tandfäste i käkbenet.","def_uk":"З'єднання, у якому зуб закріплений у комірці щелепи.","def_ru":"Соединение, при котором зуб закреплён в лунке челюсти.","n":164},{"id":"junctura-cartilaginea","cat":"Leder och muskler","sv":"broskfog","la":"junctura cartilaginea","uk":"хрящове з'єднання","ru":"хрящевое соединение","def_sv":"Fog där benen förenas av brosk och rörligheten är liten.","def_uk":"З'єднання, у якому кістки сполучені хрящем і рухливість незначна.","def_ru":"Соединение, в котором кости связаны хрящом и подвижность невелика.","n":165},{"id":"junctura-fibrosa","cat":"Leder och muskler","sv":"fibrös fog (bindvävsfog)","la":"junctura fibrosa","uk":"волокнисте з'єднання","ru":"фиброзное соединение","def_sv":"Fog där benen hålls samman av tät bindväv utan ledhåla.","def_uk":"З'єднання, у якому кістки утримуються щільною сполучною тканиною без суглобової порожнини.","def_ru":"Соединение, в котором кости удерживаются плотной соединительной тканью без суставной полости.","n":166},{"id":"ligamentum","cat":"Leder och muskler","sv":"ledband","la":"ligamentum","uk":"зв'язка","ru":"связка","def_sv":"Ett ledband är stark bindväv som håller ihop två ben.","def_uk":"Зв'язка — це міцна сполучна тканина, яка з'єднує дві кістки.","def_ru":"Связка — это прочная соединительная ткань, которая соединяет две кости.","n":167},{"id":"meniscus","cat":"Leder och muskler","sv":"menisk","la":"meniscus","uk":"меніск","ru":"мениск","def_sv":"Menisken är en broskskiva i knäleden som dämpar och stabiliserar.","def_uk":"Меніск — це хрящова пластинка в колінному суглобі, яка амортизує та стабілізує.","def_ru":"Мениск — это хрящевая пластинк ng.","def_uk":"Литковий м'яз лежить на задній поверхні гомілки і піднімає п'яту під час ходьби.","def_ru":"Икроножная мышца лежит на задней поверхности голени и поднимает пятку при ходьбе.","n":173},{"id":"musculus-gluteus-maximus","cat":"Leder och muskler","sv":"stora sätesmuskeln","la":"musculus gluteus maximus","uk":"великий сідничний м'яз","ru":"большая ягодичная мышца","def_sv":"Stora sätesmuskeln bildar skinkan och sträcker höften vid gång.","def_uk":"Великий сідничний м'яз утворює сідницю і розгинає стегно під час ходьби.","def_ru":"Большая ягодичная мышца образует ягодицу и разгибает бедро при ходьбе.","n":174},{"id":"musculus-latissimus-dorsi","cat":"Leder och muskler","sv":"breda ryggmuskeln","la":"musculus latissimus dorsi","uk":"найширший м'яз спини","ru":"широчайшая мышца спины","def_sv":"Breda ryggmuskeln täcker nedre ryggen och drar armen bakåt.","def_uk":"Найширший м'яз спини покриває нижню частину спини і тягне руку назад.","def_ru":"Широчайшая мышца спины покрывает нижнюю часть спины и тянет руку назад.","n":175},{"id":"musculus-pectoralis-major","cat":"Leder och muskler","sv":"stora bröstmuskeln","la":"musculus pectoralis major","uk":"великий грудний м'яз","ru":"большая грудная мышца","def_sv":"Stora bröstmuskeln täcker bröstkorgens framsida och för armen inåt.","def_uk":"Великий грудний м'яз покриває передню поверхню грудної клітки і приводить руку.","def_ru":"Большая грудная мышца покрывает переднюю поверхность грудной клетки и приводит руку.","n":176},{"id":"musculus-quadriceps-femoris","cat":"Leder och muskler","sv":"fyrhövdade lårmuskeln","la":"musculus quadriceps femoris","uk":"чотириголовий м'яз стегна","ru":"четырёхглавая мышца бедра","def_sv":"Fyrhövdade lårmuskeln ligger på lårets framsida och sträcker knäet.","def_uk":"Чотириголовий м'яз стегна лежить на передній поверхні стегна і розгинає коліно.","def_ru":"Четырёхглавая мышца бедра лежит на передней поверхности бедра и разгибает колено.","n":177},{"id":"musculus-rectus-abdominis","cat edbrytning av maten till små näringsämnen.","def_uk":"Травлення - це розщеплення їжі до дрібних поживних речовин.","def_ru":"Пищеварение - это расщепление пищи до мелких питательных веществ.","n":278},{"id":"duodenum","cat":"Matsmältningsorganen","sv":"tolvfingertarm","la":"duodenum","uk":"дванадцятипала кишка","ru":"двенадцатиперстная кишка","def_sv":"Tolvfingertarmen är tunntarmens första del efter magsäcken.","def_uk":"Дванадцятипала кишка - це перший відділ тонкої кишки після шлунка.","def_ru":"Двенадцатиперстная кишка - это первый отдел тонкой кишки после желудка.","n":279},{"id":"enzymum","cat":"Matsmältningsorganen","sv":"enzym","la":"enzymum","uk":"фермент (ензим)","ru":"фермент (энзим)","def_sv":"Enzym är ett protein som snabbar på nedbrytningen av näringsämnen.","def_uk":"Фермент - це білок, який прискорює розщеплення поживних речовин.","def_ru":"Фермент - это белок, который ускоряет расщепление питательных веществ.","n":280},{"id":"gaster","cat":"Matsmältningsorganen","sv":"magsäck","la":"gaster","uk":"шлунок","ru":"желудок","def_sv":"Magsäcken blandar maten med magsaft och bryter ner protein.","def_uk":"Шлунок змішує їжу зі шлунковим соком і розщеплює білки.","def_ru":"Желудок смешивает пищу с желудочным соком и расщепляет белки.","n":281},{"id":"glandulae-salivariae","cat":"Matsmältningsorganen","sv":"spottkörtlar","la":"glandulae salivariae","uk":"слинні залози","ru":"слюнные железы","def_sv":"Spottkörtlarna bildar saliv som fuktar maten och startar matsmältningen.","def_uk":"Слинні залози виробляють слину, яка зволожує їжу і починає травлення.","def_ru":"Слюнные железы вырабатывают слюну, которая увлажняет пищу и начинает пищеварение.","n":282},{"id":"hepar","cat":"Matsmältningsorganen","sv":"lever","la":"hepar","uk":"печінка","ru":"печень","def_sv":"Levern bildar galla och renar blodet från skadliga ämnen.","def_uk":"Печінка виробляє жовч і очищає кров від шкідливих речовин.","def_ru":"Печень вырабатывает жёлчь и очищает кровь от вредных веществ.","n":283},{"id":"ileum","cat":"Matsmältningsorganen","sv":"krumtarm","la":"ileum","uk":"клубова кишка","ru":"подвздошная кишка","def_sv":"Krumtarmen är tunntarmens sista del före tjocktarmen.","def_uk":"Клубова кишка - це останній відділ тонкої кишки перед товстою кишкою.","def_ru":"Подвздошная кишка - это последний отдел тонкой кишки перед толстой кишкой.","n":284},{"id":"intestinum-crassum","cat":"Matsmältningsorganen","sv":"tjocktarm","la":"intestinum crassum","uk":"товста кишка","ru":"толстая кишка","def_sv":"Tjocktarmen tar upp vatten och salter och bildar avföring.","def_uk":"Товста кишка всмоктує воду і солі та формує кал.","def_ru":"Толстая кишка всасывает воду и соли и формирует кал.","n":285},{"id":"intestinum-tenue","cat":"Matsmältningsorganen","sv":"tunntarm","la":"intestinum tenue","uk":"тонка кишка","ru":"тонкая кишка","def_sv":"Tunntarmen bryter ner maten och tar upp näringsämnen till blodet.","def_uk":"Тонка кишка розщеплює їжу і всмоктує поживні речовини в кров.","def_ru":"Тонкая кишка расщепляет пищу и всасывает питательные вещества в кровь.","n":286},{"id":"jejunum","cat":"Matsmältningsorganen","sv":"tomtarm","la":"jejunum","uk":"порожня кишка","ru":"тощая кишка","def_sv":"Tomtarmen är tunntarmens mellersta del där mycket näring tas upp.","def_uk":"Порожня кишка - це середній відділ тонкої кишки, де всмоктується багато поживних речовин.","def_ru":"Тощая кишка - это средний отдел тонкой кишки, где всасывается много питательных веществ.","n":287},{"id":"lingua","cat":"Matsmältningsorganen","sv":"tunga","la":"lingua","uk":"язик","ru":"язык","def_sv":"Tungan känner smak och hjälper till vid tuggning och sväljning.","def_uk":"Язик відчуває смак і допомагає жувати та ковтати.","def_ru":"Язык чувствует вкус и помогает жевать и глотать.","n":288},{"id":"metabolismus","cat":"Matsmältningsorganen","sv":"ämnesomsättning","la":"metabolismus","uk":"обмін речовин (метаболізм)","ru":"обмен веществ (метаболизм)","def_sv":"Ämnesomsättning är kroppens alla kemiska processer för energi och uppbyggnad.","def_uk":"Обмін речовин - це всі хімічні процеси тіла для енергії та побудови.","def_ru":"Обмен веществ - это все химические процессы тела для энергии и построения.","n":289},{"id":"oesophagus","cat":"Matsmältningsorganen","sv":"matstrupe","la":"oesophagus","uk":"стравохід","ru":"пищевод","def_sv":"Matstrupen transporterar maten från svalget ner till magsäcken.","def_uk":"Стравохід переносить їжу з глотки вниз до шлунка.","def_ru":"Пищевод переносит пищу из глотки вниз в желудок.","n":290},{"id":"pancreas","cat":"Matsmältningsorganen","sv":"bukspottkörtel","la":"pancreas","uk":"підшлункова залоза","ru":"поджелудочная железа","def_sv":"Bukspottkörteln bildar matsmältningsenzymer och hormonet insulin.","def_uk":"Підшлункова залоза виробляє травні ферменти і гормон інсулін.","def_ru":"Поджелудочная железа вырабатывает пищеварительные ферменты и гормон инсулин.","n":291},{"id":"peristalsis","cat":"Matsmältningsorganen","sv":"peristaltik","la":"peristalsis","uk":"перистальтика","ru":"перистальтика","def_sv":"Peristaltik är vågformade muskelrörelser som för maten framåt.","def_uk":"Перистальтика - це хвилеподібні рухи м'язів, які просувають їжу вперед.","def_ru":"Перистальтика - это волнообразные движения мышц, продвигающие пищу вперёд.","n":292},{"id":"peritoneum","cat":"Matsmältningsorganen","sv":"bukhinna","la":"peritoneum","uk":"очеревина","ru":"брюшина","def_sv":"Bukhinnan är hinnan som klär buken och täcker organen.","def_uk":"Очеревина - це оболонка, яка вистилає живіт і вкриває органи.","def_ru":"Брюшина - это оболочка, которая выстилает живот и покрывает органы.","n":293},{"id":"pylorus","cat":"Matsmältningsorganen","sv":"portvakt","la":"pylorus","uk":"воротар (пілорус)","ru":"привратник (пилорус)","def_sv":"Portvakten är muskeln som släpper ut maginnehållet i tolvfingertarmen.","def_uk":"Воротар - це м'яз, який випускає вміст шлунка у дванадцятипалу кишку.","def_ru":"Привратник - это мышца, которая выпускает содержимое желудка в двенадцатиперстную кишку.","n":294},{"id":"rectum","cat":"Matsmältningsorganen","sv":"ändtarm","la":"rectum","uk":"пряма кишка","ru":"прямая кишка","def_sv":"Ändtarmen samlar avföringen innan den töms ut.","def_uk":"Пряма кишка збирає кал перед його виведенням.","def_ru":"Прямая кишка собирает кал перед его выведением.","n":295},{"id":"resorptio","cat":"Matsmältningsorganen","sv":"upptag","la":"resorptio","uk":"всмоктування (резорбція)","ru":"всасывание (резорбция)","def_sv":"Resorption är när näring tas upp från tarmen till blodet.","def_uk":"Резорбція - це всмоктування поживних речовин із кишківника в кров.","def_ru":"Резорбция - это всасывание питательных веществ из кишечника в кровь.","n":296},{"id":"vesica-biliaris","cat":"Matsmältningsorganen","sv":"gallblåsa","la":"vesica biliaris","uk":"жовчний міхур","ru":"жёлчный пузырь","def_sv":"Gallblåsan lagrar galla och tömmer den i tolvfingertarmen.","def_uk":"Жовчний міхур накопичує жовч і виділяє її у дванадцятипалу кишку.","def_ru":"Жёлчный пузырь накапливает жёлчь и выделяет её в двенадцатиперстную кишку.","n":297},{"id":"villi-intestinales","cat":"Matsmältningsorganen","sv":"tarmludd","la":"villi intestinales","uk":"кишкові ворсинки","ru":"кишечные ворсинки","def_sv":"Tarmludd är små utskott som ökar tunntarmens upptagsyta.","def_uk":"Кишкові ворсинки - це маленькі вирости, що збільшують всисну поверхню тонкої кишки.","def_ru":"Кишечные ворсинки - это маленькие выросты, увеличивающие всасывающую поверхность тонкой кишки.","n":298},{"id":"aequilibrium-aquae-et-electrolytorum","cat":"Urinorganen","sv":"vätske- och elektrolytbalans","la":"aequilibrium aquae et electrolytorum","uk":"водно-електролітний баланс","ru":"водно-электролитный баланс","def_sv":"Vätske- och elektrolytbalans är jämvikt mellan vatten och salter.","def_uk":"Водно-електролітний баланс - це рівновага між водою та солями.","def_ru":"Водно-электролитный баланс - это равновесие между водой и солями.","n":299},{"id":"catheter-urinarius","cat":"Urinorganen","sv":"urinkateter","la":"catheter urinarius","uk":"сечовий катетер","ru":"мочевой катетер","def_sv":"En urinkateter är en tunn slang som tömmer urinblåsan.","def_uk":"Сечовий катетер - це тонка трубка, що випорожнює сечовий міхур.","def_ru":"Мочевой катетер - это тонкая трубка, опорожняющая мочевой пузырь.","n":300},{"id":"cortex-renalis","cat":"Urinorganen","sv":"njurbark","la":"cortex renalis","uk":"кіркова речовина нирки","ru":"корковое вещество почки","def_sv":"Njurbarken är njurens yttre del där blodet filtreras.","def_uk":"Кіркова речовина є зовнішньою частиною нирки, де фільтрується кров.","def_ru":"Корковое вещество - наружная часть почки, где фильтруется кровь.","n":301},{"id":"diuresis","cat":"Urinorganen","sv":"diures (urinmängd)","la":"diuresis","uk":"діурез","ru":"диурез","def_sv":"Diures är mängden urin som bildas under en tid.","def_uk":"Діурез - це кількість сечі, утвореної за певний час.","def_ru":"Диурез - это количество мочи, образованной за определённое время.","n":302},{"id":"filtratio","cat":"Urinorganen","sv":"filtration","la":"filtratio","uk":"фільтрація","ru":"фильтрация","def_sv":"Filtration är när vätska pressas ur blodet i glomerulus.","def_uk":"Фільтрація - це витиснення рідини з крові у клубочку.","def_ru":"Фильтрация - это выдавливание жидкости из крови в клубочке.","n":303},{"id":"glomerulus","cat":"Urinorganen","sv":"glomerulus (kärlnystan)","la":"glomerulus","uk":"клубочок","ru":"клубочек","def_sv":"I glomerulus filtreras blodet till primärurin.","def_uk":"У клубочку кров фільтрується у первинну сечу.","def_ru":"В клубочке кровь фильтруется в первичную мочу.","n":304},{"id":"incontinentia-urinae","cat":"Urinorganen","sv":"urininkontinens","la":"incontinentia urinae","uk":"нетримання сечі","ru":"недержание мочи","def_sv":"Urininkontinens är ofrivilligt läckage av urin.","def_uk":"Нетримання сечі - це мимовільне витікання сечі.","def_ru":"Недержание мочи - это непроизвольное подтекание мочи.","n":305},{"id":"medulla-renalis", /* LANGS, DEFLANGS, UILANGS, CATS och DATA fylls i av tools/sync_html_data.py
   från filerna i data/ — redigera dem där, inte här.
   Lägga till ett språk: lägg in det i data/sprak.json, lägg fälten (t.ex. pl
   och def_pl) på varje term i anatomi-termer.json, översätt kategorierna i
   kategorier.json och kör sync-verktyget. Resten härleds. */
const LANGS = {"sv":"Svenska","la":"Latin","uk":"Українська","ru":"Русский"};
const DEFLANGS = {"sv":"Svenska","uk":"Українська","ru":"Русский","none":"—"};
const UILANGS = {"sv":"Svenska","uk":"Українська","ru":"Русский","en":"English"};

const TERMLANGS = Object.keys(LANGS);
const DEFFIELDS = Object.keys(DEFLANGS).filter(k=>k!=="none").map(k=>"def_"+k);

/* Kategorinamnen står på svenska i datan; CATS håller översättningarna. */
function catName(cat){ return (CATS[cat]||{})[state.ui] || cat; }

/* Bilderna hotlänkas från Wikimedia Commons. Varje bild har en egen licens och
   måste visas tillsammans med upphovsperson och licensnamn. */
function imgOf(item){ const e=IMGS[item.id]; return e && e.bild ? e : null; }
function articleOf(item){ const e=IMGS[item.id]; return e && e.artikel ? e.artikel : null; }

/* Bilder som flera termer delar duger inte som frågebild — samma bild skulle
   ha flera rätta svar. Bildquizet använder därför bara unika bilder. */
const IMG_USES = (()=>{ const c={};
  for(const k in IMGS){ const b=IMGS[k].bild; if(b) c[b]=(c[b]||0)+1; } return c; })();
function uniqueImg(item){ const e=imgOf(item); return e && IMG_USES[e.bild]===1 ? e : null; }

/* Upphovsfältet på Commons är fritext och kan vara en hel licensuppsats.
   Kapa vid visning, inte i datan — hela uppgiften ligger kvar i title och på
   filsidan, så attributionen går aldrig förlorad. */
const MAX_CREDIT = 80;
function shortCredit(t){
  t=String(t||"").trim();
  /* Commons anger härledda verk som "Fil_A.svg: *Fil_B.svg: Namn Namnsson
     derivative work: Någon". Filnamnen äter upp hela utrymmet och namnet — som
     CC BY kräver att vi anger — faller bort. Skala av filnamnsleden först. */
  const stripped=t.replace(/^(?:\**\s*[^\s:]+\.(?:svg|png|jpe?g|gif|tif+)\s*:\s*)+/i,"")
                  .replace(/^\*+\s*/,"").trim();
  // Består upphovsfältet bara av filnamn finns inget namn att rädda — behåll
  // originalet hellre än att visa en tom kreditrad.
  if(stripped) t=stripped;
  if(t.length<=MAX_CREDIT) return t;
  const cut=t.slice(0,MAX_CREDIT).replace(/\s+\S*$/,"").replace(/[ ,.;:-]+$/,"");
  return (cut||t.slice(0,MAX_CREDIT))+"…";
}

function credit(e){
  const licUrl=safeLink(e.licensurl), fileUrl=safeLink(e.filsida);
  const lic = licUrl
    ? '<a href="'+esc(licUrl)+'" rel="noopener">'+esc(e.licens)+'</a>'
    : esc(e.licens);
  const src = fileUrl
    ? '<a href="'+esc(fileUrl)+'" rel="noopener">Wikimedia Commons</a>'
    : "Wikimedia Commons";
  const who=String(e.upphov||"");
  return '<span title="'+esc(who)+'">'+esc(shortCredit(who))+'</span> · '+lic+' · '+src;
}

/* Felrapport per term: en förifylld GitHub-diskussion, med e-post som reserv
   för den som inte har ett GitHub-konto. */
function reportLinks(item){
  const title="Fel i term: "+item.sv+" ("+item.la+")";
  const body=["**Term-id:** `"+item.id+"`",
    "**Kategori:** "+item.cat,
    "**Svenska:** "+item.sv, "**Latin:** "+item.la,
    "**Ukrainska:** "+item.uk, "**Ryska:** "+item.ru,
    "", "Beskriv felet här (fel översättning, fel förklaring, olämplig eller felaktig bild ...):", ""].join("\n");
  const gh=LINKS.repo+"/discussions/new?category=general&title="+encodeURIComponent(title)
    +"&body="+encodeURIComponent(body);
  const mail="mailto:orjan.lundberg@gmail.com?subject="+encodeURIComponent(title)
    +"&body="+encodeURIComponent(body.replace(/\*\*/g,""));
  return {gh,mail};
}

function renderReport(item, revealed){
  const el=$("creport");
  el.innerHTML="";
  if(!item) return;

  /* Både artikeladressen och rapportlänkarna bär svaret: artikel-URL:en
     innehåller den svenska termen, och rapportens titel och brödtext innehåller
     alla fyra språken plus term-id:t (som är härlett ur latinet). Före
     avslöjandet skulle de synas i statusraden vid hovring och i DOM:en, så då
     byggs adressen först vid klick i stället för att stå i href. */
  const add=(text,href,onclick)=>{
    if(el.childNodes.length) el.appendChild(document.createTextNode(" · "));
    const a=document.createElement("a");
    a.textContent=text;
    a.rel="noopener";
    if(href){ a.href=href; }
    else { a.href="#"; a.onclick=e=>{ e.preventDefault();
      const url=onclick();
      // window.open på en mailto-adress lämnar en tom flik i många webbläsare.
      if(url.slice(0,7)==="mailto:") location.href=url;
      else window.open(url, "_blank", "noopener"); }; }
    el.appendChild(a);
  };

  if(revealed){
    const a=safeLink(articleOf(item));
    if(a) add(T("b_wiki"), a);
  }
  const links=()=>reportLinks(item);
  add(T("b_report"), revealed?links().gh:null, ()=>links().gh);
  add("e-post",      revealed?links().mail:null, ()=>links().mail);
}

const state = {
  mode:"card", front:"sv", backs:Object.keys(LANGS), def:"sv", ui:"sv",
  cats:new Set(DATA.map(d=>d.cat)),
  queue:[], current:null, flipped:false, seen:0, known:0, history:[], redo:[],
  qn:0, qr:0, qcur:null, qanswered:false,
  in_:0, ir:0, icur:null, ianswered:false,
  // Utfällt på stora skärmar, hopfällt på telefon där panelen annars skymmer kortet.
  settingsOpen: !window.matchMedia("(max-width:700px)").matches
};

const $ = id => document.getElementById(id);
const T = k => (I18N[state.ui]||I18N.sv)[k] || k;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pool(){ return DATA.filter(d=>state.cats.has(d.cat)); }

function buildSelects(){
  const f=$("front"); f.innerHTML="";
  for(const k in LANGS){ const o=document.createElement("option"); o.value=k; o.textContent=LANGS[k]; f.appendChild(o); }
  f.value=state.front;
  const d=$("deflang"); d.innerHTML="";
  for(const k in DEFLANGS){ const o=document.createElement("option"); o.value=k; o.textContent=DEFLANGS[k]; d.appendChild(o); }
  d.value=state.def;
  const u=$("ui"); u.innerHTML="";
  for(const k in UILANGS){ const o=document.createElement("option"); o.value=k;
    o.textContent=UILANGS[k]; u.appendChild(o); }
  u.value=state.ui;
}

function buildBackChips(){
  const c=$("backs"); c.innerHTML="";
  for(const k in LANGS){
    if(k===state.front) continue;
    const b=document.createElement("span");
    b.className="chip"+(state.backs.includes(k)?" on":"");
    b.textContent=LANGS[k];
    b.onclick=()=>{
      const i=state.backs.indexOf(k);
      if(i>=0){ if(state.backs.filter(x=>x!==state.front).length>1) state.backs.splice(i,1); }
      else state.backs.push(k);
      buildBackChips(); invalidateQuestions(); render();
    };
    c.appendChild(b);
  }
}

function buildCatChips(){
  const c=$("cats"); c.innerHTML="";
  const cats=[...new Set(DATA.map(d=>d.cat))];
  for(const cat of cats){
    const n=DATA.filter(d=>d.cat===cat).length;
    const b=document.createElement("span");
    b.className="chip"+(state.cats.has(cat)?" on":"");
    b.textContent=catName(cat)+" ("+n+")";
    b.onclick=()=>{ state.cats.has(cat)?state.cats.delete(cat):state.cats.add(cat);
      buildCatChips(); invalidateQuestions(); resetQueue(); render(); };
    c.appendChild(b);
  }
  $("count").textContent=pool().length+" / "+DATA.length;
}

function helpOpen(){ return $("help").className!=="hidden"; }

/* Tema: auto -> ljust -> mörkt -> auto. "auto" lagras genom att attributet tas
   bort, så mediefrågan får styra igen. */
const THEMES = ["auto","light","dark"];
const THEME_ICON = {auto:"\u25D1", light:"\u2600", dark:"\u263E"};

function currentTheme(){
  return document.documentElement.getAttribute("data-theme") || "auto";
}

function applyTheme(name){
  const root=document.documentElement;
  if(name==="auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", name);
  try{
    if(name==="auto") localStorage.removeItem("tema");
    else localStorage.setItem("tema", name);
  }catch(e){/* avstängd lagring: valet gäller bara den här sidvisningen */}
  // Adressfältets färg på telefon ska följa med.
  const bg=getComputedStyle(root).getPropertyValue("--bg").trim();
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta && bg) meta.setAttribute("content", bg);
  renderThemeButton();
}

function renderThemeButton(){
  const t=currentTheme();
  const label=T("b_theme")+": "+T({auto:"t_auto",light:"t_light",dark:"t_dark"}[t]);
  const b=$("themebtn");
  b.textContent=THEME_ICON[t];
  b.setAttribute("aria-label", label);
  b.title=label;
}

function cycleTheme(){
  applyTheme(THEMES[(THEMES.indexOf(currentTheme())+1) % THEMES.length]);
}

/* aria-modal ensamt gör ingenting åt tangentbordet: utan det här kunde Tab
   vandra ut till knapparna bakom överlägget. */
function trapFocus(e){
  if(e.key!=="Tab" || !helpOpen()) return;
  const f=$("help").querySelectorAll("a[href], button:not([disabled])");
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function toggleHelp(open){
  const show = open===undefined ? !helpOpen() : open;
  $("helpbtn").setAttribute("aria-expanded", String(show));
  if(show){ renderHelp(); $("help").className=""; $("helpclose").focus(); }
  else { $("help").className="hidden"; $("helpbtn").focus(); }
}

function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=T(el.dataset.i18n); });
  // Knappen visar bara "?" — skärmläsaren behöver ett riktigt namn.
  $("helpbtn").setAttribute("aria-label", T("b_help"));
  $("helpbtn").title=T("b_help");
  renderThemeButton();
  renderFooter();
  $("title").textContent=T("title");
  $("search").placeholder=T("search");
  document.documentElement.lang = state.ui==="en"?"en":state.ui;
  if(helpOpen()) renderHelp();
  renderSummary();
}

/* Ukrainska och ryska har tre numerusformer efter räkneord (1 картка,
   2-4 картки, 5+ карток), svenska och engelska två. */
function plural(n,forms){
  if(forms.length<3) return forms[n===1?0:1];
  const t=n%10, h=n%100;
  if(t===1 && h!==11) return forms[0];
  if(t>=2 && t<=4 && (h<12||h>14)) return forms[1];
  return forms[2];
}

/* När inställningarna är hopfällda ersätts de av en rad som visar vad som är
   valt, så att man ser urvalet utan att fälla ut panelen igen. */
function renderSummary(){
  const el=$("summary");
  if(state.settingsOpen){ el.className="hidden"; return; }
  el.className="";
  const backs=backLangs().map(k=>LANGS[k]).join(", ")||"—";
  const total=new Set(DATA.map(d=>d.cat)).size, n=pool().length;
  const cats = state.cats.size===total
    ? "<b>"+esc(T("s_allcats"))+"</b>"
    : "<b>"+state.cats.size+"/"+total+"</b> "+esc(plural(total,T("s_cats")));
  el.innerHTML="<b>"+esc(LANGS[state.front])+"</b> → "+esc(backs)
    +"<span class=\"sep\">·</span>"+cats
    +"<span class=\"sep\">·</span><b>"+n+"</b> "+esc(plural(n,T("s_cards")));
}

function setSettingsOpen(open){
  state.settingsOpen=open;
  $("settings").className=open?"":"hidden";
  $("togglesettings").setAttribute("aria-expanded",String(open));
  renderSummary();
}

function resetQueue(){
  state.queue=shuffle(pool().slice());
  state.current=state.queue.shift()||null;
  state.flipped=false; state.seen=0; state.known=0; state.history=[]; state.redo=[];
}

function backLangs(){ return state.backs.filter(k=>k!==state.front); }

/* En pågående fråga kan handla om en term som inte längre ingår i urvalet.
   Rapportraden ligger utanför lägesvyerna och skulle annars fortsätta visa den. */
function invalidateQuestions(){ state.qcur=null; state.icur=null;
  state.qanswered=false; state.ianswered=false; }

function renderCardImage(item, shown){
  const box=$("cimg"), e=item&&imgOf(item);
  if(!e||!shown){ box.className="termimg hidden"; box.innerHTML=""; return; }
  box.className="termimg";
  // crossorigin gör hämtningen till en CORS-förfrågan. Utan den blir svaret
  // ogenomskinligt (type "opaque", ok=false) och service workern kan inte
  // cacha bilden — offlinestödet fanns bara på pappret.
  box.innerHTML='<img loading="lazy" crossorigin="anonymous" alt="'+esc(item.sv)
    +'" src="'+esc(safeUrl(e.bild))+'">'
    +'<div class="imgcred">'+credit(e)+'</div>';
}

function renderCard(){
  const c=state.current;
  if(!c){
    $("fterm").textContent = pool().length ? T("done") : T("nocards");
    renderCardImage(null,false); renderReport(null);
    $("flabel").textContent=""; $("answers").className="answers hidden";
    $("hint").textContent = pool().length ? T("restart") : "";
    return;
  }
  $("flabel").textContent=LANGS[state.front]+" · "+catName(c.cat);
  $("fterm").textContent=c[state.front];
  const a=$("answers");
  a.innerHTML="";
  for(const k of backLangs()){
    const row=document.createElement("div"); row.className="ans";
    const t=document.createElement("span"); t.className="tag"; t.textContent=k;
    const v=document.createElement("span"); v.className="ansval"; v.textContent=c[k];
    row.appendChild(t); row.appendChild(v); a.appendChild(row);
  }
  if(state.def!=="none"){
    const d=document.createElement("div"); d.className="def"; d.textContent=c["def_"+state.def]||"";
    a.appendChild(d);
  }
  a.className = state.flipped ? "answers" : "answers hidden";
  renderCardImage(c, state.flipped);
  renderReport(c, state.flipped);
  $("hint").textContent = state.flipped ? "" : T("h_tap");
  $("s_seen").textContent=state.seen; $("s_known").textContent=state.known;
  $("s_left").textContent=state.queue.length+(state.current?1:0);
}

/* Hur många steg bakåt man kan gå. Varje steg sparar en kopia av kön, så
   djupet kostar minne — 50 räcker gott för en genomgång. */
const HISTORY_MAX = 50;

function next(known, replay){
  // Ett nytt betyg gör den sparade framåtvägen ogiltig.
  if(!replay) state.redo.length=0;
  if(state.current){
    // Spara hela tillståndet, inte bara kortet: annars driver statistiken och
    // "repetera"-kön isär när man går tillbaka.
    state.history.push({item:state.current, queue:state.queue.slice(),
                        seen:state.seen, known:state.known, grade:known});
    if(state.history.length>HISTORY_MAX) state.history.shift();
    state.seen++;
    if(known===true) state.known++;
    if(known===false) state.queue.push(state.current);
  }
  state.current=state.queue.shift()||null;
  state.flipped=false;
  renderCard();
}

function prev(){
  const step=state.history.pop();
  if(!step) return false;
  // Spara betyget som gällde kortet vi lämnar, så att en framåtpil återställer
  // det i stället för att tyst nedgradera "kan" till "hoppa över".
  state.redo.push(step.grade);
  state.queue=step.queue;
  state.current=step.item;
  state.seen=step.seen; state.known=step.known;
  // Kortet har redan visats, så det kommer tillbaka vänt — då fungerar
  // vänster och höger som symmetrisk navigering.
  state.flipped=true;
  renderCard();
  return true;
}

function newQuestion(){
  const p=pool();
  if(p.length<4){ $("qterm").textContent=T("nocards"); $("qopts").innerHTML="";
    state.qcur=null; renderReport(null); return; }
  const item=p[Math.floor(Math.random()*p.length)];
  const ansLang=backLangs()[0]||"la";
  const others=shuffle(p.filter(x=>x.id!==item.id && x[ansLang]!==item[ansLang])).slice(0,3);
  const opts=shuffle([item,...others]);
  state.qcur={item,ansLang}; state.qanswered=false;
  renderReport(item, false);
  $("qlabel").textContent=LANGS[state.front]+" → "+LANGS[ansLang]+" · "+catName(item.cat);
  $("qterm").textContent=item[state.front];
  $("qdef").className="def hidden";
  const box=$("qopts"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="qopt"; b.textContent=o[ansLang];
    b.onclick=()=>{
      if(state.qanswered) return;
      state.qanswered=true; state.qn++;
      const right=o.id===item.id;
      if(right) state.qr++;
      [...box.children].forEach(ch=>{
        if(ch.textContent===item[ansLang]) ch.className="qopt right";
        else if(ch===b) ch.className="qopt wrong";
      });
      if(state.def!=="none"){ $("qdef").textContent=item["def_"+state.def]||""; $("qdef").className="def"; }
      $("q_n").textContent=state.qn; $("q_r").textContent=state.qr;
      renderReport(item, true);
    };
    box.appendChild(b);
  });
}

/* Bildquiz: visa bilden, låt eleven välja rätt term. Bara termer vars bild är
   unik kan bli frågor — en delad bild skulle ha flera rätta svar. */
function imagePool(){ return pool().filter(uniqueImg); }

function newImageQuestion(){
  const p=imagePool();
  if(p.length<4){
    $("qimg").innerHTML=""; $("icred").innerHTML=""; $("iopts").innerHTML="";
    $("ilabel").textContent="";
    $("iopts").textContent=T("s_noimg"); state.icur=null; return;
  }
  const item=p[Math.floor(Math.random()*p.length)];
  const e=uniqueImg(item);
  const others=shuffle(p.filter(x=>x.id!==item.id && x[state.front]!==item[state.front])).slice(0,3);
  const opts=shuffle([item,...others]);
  state.icur={item}; state.ianswered=false;
  $("ilabel").textContent=LANGS[state.front]+" · "+catName(item.cat);
  $("qimg").innerHTML='<img crossorigin="anonymous" alt="" src="'+esc(safeUrl(e.bild))+'">';
  $("icred").innerHTML=credit(e);
  const box=$("iopts"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="qopt"; b.textContent=o[state.front];
    b.onclick=()=>{
      if(state.ianswered) return;
      state.ianswered=true; state.in_++;
      if(o.id===item.id) state.ir++;
      [...box.children].forEach(ch=>{
        if(ch.textContent===item[state.front]) ch.className="qopt right";
        else if(ch===b) ch.className="qopt wrong";
      });
      $("i_n").textContent=state.in_; $("i_r").textContent=state.ir;
      renderReport(item, true);
    };
    box.appendChild(b);
  });
  renderReport(item, false);
}

function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const langs=TERMLANGS;
  const defs=DEFFIELDS;
  const rows=pool().filter(d=>!q
    ||langs.some(k=>String(d[k]||"").toLowerCase().includes(q))
    ||defs.some(k=>String(d[k]||"").toLowerCase().includes(q))
    ||catName(d.cat).toLowerCase().includes(q));
  let h="<thead><tr><th>#</th>";
  for(const k of langs) h+="<th>"+LANGS[k]+"</th>";
  if(state.def!=="none") h+="<th>"+DEFLANGS[state.def]+"</th>";
  h+="<th>"+T("cat")+"</th></tr></thead><tbody>";
  for(const d of rows){
    h+="<tr><td>"+d.n+"</td>";
    for(const k of langs) h+="<td>"+esc(d[k])+"</td>";
    if(state.def!=="none") h+="<td>"+esc(d["def_"+state.def]||"")+"</td>";
    h+="<td>"+esc(catName(d.cat))+"</td></tr>";
  }
  $("tbl").innerHTML=h+"</tbody>";
}
function esc(s){ return String(s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* Bild- och licensadresserna kommer ordagrant från Wikimedias API och bakas in
   i href/src. Släpp bara igenom https-adresser — en javascript:-URL i ett
   redigerbart metadatafält ska inte kunna bli en klickbar länk. */
function safeUrl(u){ return /^https:\/\//.test(String(u||"")) ? String(u) : ""; }
function safeLink(u){ return /^https?:\/\//.test(String(u||"")) ? String(u) : ""; }

function render(){
  $("view_card").className = state.mode==="card"?"":"hidden";
  $("view_quiz").className = state.mode==="quiz"?"":"hidden";
  $("view_image").className = state.mode==="image"?"":"hidden";
  $("view_list").className = state.mode==="list"?"":"hidden";
  if(state.mode==="card") renderCard();
  if(state.mode==="quiz"){ if(!state.qcur) newQuestion(); }
  if(state.mode==="image"){ if(!state.icur) newImageQuestion(); }
  if(state.mode==="list") renderList();
  // Rapportraden ligger utanför lägesvyerna och måste därför sättas om vid
  // varje lägesbyte — annars visas föregående lägets svar som redan röjt.
  if(state.mode==="card") renderReport(state.current, state.flipped);
  else if(state.mode==="quiz") renderReport(state.qcur&&state.qcur.item, state.qanswered);
  else if(state.mode==="image") renderReport(state.icur&&state.icur.item, state.ianswered);
  else renderReport(null);
  $("total").textContent = " " + DATA.length + " termer / термінів / терминов.";
  renderSummary();
}

$("togglesettings").onclick=()=>setSettingsOpen(!state.settingsOpen);
$("themebtn").onclick=cycleTheme;
$("helpbtn").onclick=()=>toggleHelp();
$("helpclose").onclick=()=>toggleHelp(false);
$("help").onclick=e=>{ if(e.target===$("help")) toggleHelp(false); };
$("summary").onclick=()=>setSettingsOpen(true);
$("summary").onkeydown=e=>{ if(e.key==="Enter"||e.code==="Space"){ e.preventDefault(); setSettingsOpen(true); } };

$("modes").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.mode=b.dataset.mode;
  [...$("modes").children].forEach(x=>x.className = x===b?"on":"");
  render();
};
$("card").onclick=()=>{ if(state.current){ state.flipped=!state.flipped; renderCard(); } else { resetQueue(); renderCard(); } };
$("known").onclick=e=>{e.stopPropagation();next(true)};
$("again").onclick=e=>{e.stopPropagation();next(false)};
$("skip").onclick=e=>{e.stopPropagation();next(null)};
$("qnext").onclick=()=>newQuestion();
$("inext").onclick=()=>newImageQuestion();
$("front").onchange=e=>{ state.front=e.target.value;
  if(!backLangs().length) state.backs=Object.keys(LANGS).filter(k=>k!==state.front);
  buildBackChips(); invalidateQuestions(); resetQueue(); render(); };
$("deflang").onchange=e=>{ state.def=e.target.value; render(); };
$("ui").onchange=e=>{ state.ui=e.target.value; buildCatChips(); applyI18n(); render(); };
$("allcats").onclick=()=>{ state.cats=new Set(DATA.map(d=>d.cat)); buildCatChips(); invalidateQuestions(); resetQueue(); render(); };
$("nocats").onclick=()=>{ state.cats=new Set(); buildCatChips(); invalidateQuestions(); resetQueue(); render(); };
$("search").oninput=()=>renderList();
document.addEventListener("keydown",e=>{
  // Esc måste fungera även med fokus i dialogens stängknapp.
  if(e.key==="Escape" && helpOpen()){ e.preventDefault(); toggleHelp(false); return; }
  if(helpOpen() && e.key==="Tab"){ trapFocus(e); return; }
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;

  // Hjälpen gäller hela appen och ligger därför före lägeskontrollerna.
  if(e.key==="h"||e.key==="H"||e.key==="?"){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==="t"||e.key==="T"){ e.preventDefault(); cycleTheme(); return; }
  // Med hjälpen öppen ska inga andra genvägar plocka upp tangenten.
  if(helpOpen()) return;

  if(state.mode==="quiz"||state.mode==="image"){
    if(e.key==="ArrowRight"){ e.preventDefault();
      (state.mode==="quiz"?newQuestion:newImageQuestion)(); }
    return;
  }
  if(state.mode!=="card") return;

  if(e.code==="Space"){ e.preventDefault(); $("card").click(); return; }
  if(e.key==="1"){ next(false); return; }
  if(e.key==="2"){ next(true); return; }
  if(e.key==="ArrowRight"){
    e.preventDefault();
    // Första trycket visar svaret, nästa går vidare.
    if(state.current && !state.flipped){ state.flipped=true; renderCard(); }
    else if(state.current){
      // Har vi gått bakåt återanvänds det ursprungliga betyget.
      if(state.redo.length) next(state.redo.pop(), true);
      else next(null);
    }
    else { resetQueue(); renderCard(); }
    return;
  }
  if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); return; }
});

buildSelects(); buildBackChips(); buildCatChips(); setSettingsOpen(state.settingsOpen);
applyTheme(currentTheme()); applyI18n(); resetQueue(); render();
</script>

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Besöksräkning med GoatCounter. Vad som registreras: sidadress, hänvisande
   sida, webbläsare och operativsystem, skärmstorlek och land. Ingen kaka, ingen
   lagrad IP-adress och inget som pekar ut en enskild besökare.

   CODE är kontonamnet på goatcounter.com. Forkar du sajten: byt det till ditt
   eget konto eller ta bort anropet nedan, annars hamnar din trafik i någon
   annans statistik.

   Räknaren laddas bara över https, så lokala körningar och rökprovet i CI inte
   räknas som besök, och inte alls om besökaren bett om att slippa spårning. */
function installCounter(loc, nav, doc, code){
  if(loc.protocol !== "https:") return null;
  // Äldre webbläsare svarade "yes" i stället för "1" på en uttrycklig avböjan.
  var raw = nav.doNotTrack || nav.msDoNotTrack || (doc.defaultView && doc.defaultView.doNotTrack);
  if(raw === "1" || raw === "yes" || nav.globalPrivacyControl === true) return null;
  var el = doc.createElement("script");
  el.async = true;
  el.src = "vendor/count.js";
  el.setAttribute("data-goatcounter", "https://" + code + ".goatcounter.com/count");
  doc.head.appendChild(el);
  return el;
}

var GC_CODE = "oluies";
installCounter(location, navigator, document, GC_CODE);
</script>
