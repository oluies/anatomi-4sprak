/* Sidfotens metarad har länkar inuti meningarna och kan därför inte sättas med
   data-i18n, som skriver över hela elementets innehåll. */
function renderFooter(){
  const a=(href,text)=>'<a href="'+href+'" rel="noopener">'+esc(text)+'</a>';
  const by=esc(T("f_by"))+" "+a(LINKS.author,"Örjan Lundberg");
  const lic=esc(T("f_license"))+" "+a(LINKS.license,"CC BY-SA 4.0");
  const wiki=esc(T("f_wiki")).replace("%s", a(LINKS.wiki,"Människans anatomi"));
  $("footmeta").innerHTML=by+" · "+lic+"<br>"+wiki;
}

function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=T(el.dataset.i18n); });
  renderFooter();
  $("title").textContent=T("title");
  $("search").placeholder=T("search");
  document.documentElement.lang = state.ui==="en"?"en":state.ui;
  renderSummary();
}

/* Ukrainska och ryska har tre numerusformer efter räkneord (1 картка,
   2-4 картки, 5+ карток), svenska och engelska två. */
function plural(n,forms){
  if(forms.length<3) return forms[n===1?0:1];
  const t=n%10, h=n%100;
  if(t===1 && h!==11) return forms[0];
  if(t>=2 && t<=4 && (h<12||h>14)) return forms[1];
  return forms[2];
}

/* När inställningarna är hopfällda ersätts de av en rad som visar vad som är
   valt, så att man ser urvalet utan att fälla ut panelen igen. */
function renderSummary(){
  const el=$("summary");
  if(state.settingsOpen){ el.className="hidden"; return; }
  el.className="";
  const backs=backLangs().map(k=>LANGS[k]).join(", ")||"—";
  const total=new Set(DATA.map(d=>d.cat)).size, n=pool().length;
  const cats = state.cats.size===total
    ? "<b>"+esc(T("s_allcats"))+"</b>"
    : "<b>"+state.cats.size+"/"+total+"</b> "+esc(plural(total,T("s_cats")));
  el.innerHTML="<b>"+esc(LANGS[state.front])+"</b> → "+esc(backs)
    +"<span class=\"sep\">·</span>"+cats
    +"<span class=\"sep\">·</span><b>"+n+"</b> "+esc(plural(n,T("s_cards")));
}

function setSettingsOpen(open){
  state.settingsOpen=open;
  $("settings").className=open?"":"hidden";
  $("togglesettings").setAttribute("aria-expanded",String(open));
  renderSummary();
}

function resetQueue(){
  state.queue=shuffle(pool().slice());
  state.current=state.queue.shift()||null;
  state.flipped=false; state.seen=0; state.known=0;
}

function backLangs(){ return state.backs.filter(k=>k!==state.front); }

function renderCard(){
  const c=state.current;
  if(!c){
    $("fterm").textContent = pool().length ? T("done") : T("nocards");
    $("flabel").textContent=""; $("answers").className="answers hidden";
    $("hint").textContent = pool().length ? T("restart") : "";
    return;
  }
  $("flabel").textContent=LANGS[state.front]+" · "+catName(c.cat);
  $("fterm").textContent=c[state.front];
  const a=$("answers");
  a.innerHTML="";
  for(const k of backLangs()){
    const row=document.createElement("div"); row.className="ans";
    const t=document.createElement("span"); t.className="tag"; t.textContent=k;
    const v=document.createElement("span"); v.className="ansval"; v.textContent=c[k];
    row.appendChild(t); row.appendChild(v); a.appendChild(row);
  }
  if(state.def!=="none"){
    const d=document.createElement("div"); d.className="def"; d.textContent=c["def_"+state.def]||"";
    a.appendChild(d);
  }
  a.className = state.flipped ? "answers" : "answers hidden";
  $("hint").textContent = state.flipped ? "" : T("h_tap");
  $("s_seen").textContent=state.seen; $("s_known").textContent=state.known;
  $("s_left").textContent=state.queue.length+(state.current?1:0);
}

function next(known){
  if(state.current){
    state.seen++;
    if(known===true) state.known++;
    if(known===false) state.queue.push(state.current);
  }
  state.current=state.queue.shift()||null;
  state.flipped=false;
  renderCard();
}

function newQuestion(){
  const p=pool();
  if(p.length<4){ $("qterm").textContent=T("nocards"); $("qopts").innerHTML=""; return; }
  const item=p[Math.floor(Math.random()*p.length)];
  const ansLang=backLangs()[0]||"la";
  const others=shuffle(p.filter(x=>x.id!==item.id && x[ansLang]!==item[ansLang])).slice(0,3);
  const opts=shuffle([item,...others]);
  state.qcur={item,ansLang}; state.qanswered=false;
  $("qlabel").textContent=LANGS[state.front]+" → "+LANGS[ansLang]+" · "+catName(item.cat);
  $("qterm").textContent=item[state.front];
  $("qdef").className="def hidden";
  const box=$("qopts"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="qopt"; b.textContent=o[ansLang];
    b.onclick=()=>{
      if(state.qanswered) return;
      state.qanswered=true; state.qn++;
      const right=o.id===item.id;
      if(right) state.qr++;
      [...box.children].forEach(ch=>{
        if(ch.textContent===item[ansLang]) ch.className="qopt right";
        else if(ch===b) ch.className="qopt wrong";
      });
      if(state.def!=="none"){ $("qdef").textContent=item["def_"+state.def]||""; $("qdef").className="def"; }
      $("q_n").textContent=state.qn; $("q_r").textContent=state.qr;
    };
    box.appendChild(b);
  });
}

function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const langs=TERMLANGS;
  const defs=DEFFIELDS;
  const rows=pool().filter(d=>!q
    ||langs.some(k=>String(d[k]||"").toLowerCase().includes(q))
    ||defs.some(k=>String(d[k]||"").toLowerCase().includes(q))
    ||catName(d.cat).toLowerCase().includes(q));
  let h="<thead><tr><th>#</th>";
  for(const k of langs) h+="<th>"+LANGS[k]+"</th>";
  if(state.def!=="none") h+="<th>"+DEFLANGS[state.def]+"</th>";
  h+="<th>"+T("cat")+"</th></tr></thead><tbody>";
  for(const d of rows){
    h+="<tr><td>"+d.n+"</td>";
    for(const k of langs) h+="<td>"+esc(d[k])+"</td>";
    if(state.def!=="none") h+="<td>"+esc(d["def_"+state.def]||"")+"</td>";
    h+="<td>"+esc(catName(d.cat))+"</td></tr>";
  }
  $("tbl").innerHTML=h+"</tbody>";
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(){
  $("view_card").className = state.mode==="card"?"":"hidden";
  $("view_quiz").className = state.mode==="quiz"?"":"hidden";
  $("view_list").className = state.mode==="list"?"":"hidden";
  if(state.mode==="card") renderCard();
  if(state.mode==="quiz"){ if(!state.qcur) newQuestion(); }
  if(state.mode==="list") renderList();
  $("total").textContent = " " + DATA.length + " termer / термінів / терминов.";
  renderSummary();
}

$("togglesettings").onclick=()=>setSettingsOpen(!state.settingsOpen);
$("summary").onclick=()=>setSettingsOpen(true);
$("summary").onkeydown=e=>{ if(e.key==="Enter"||e.code==="Space"){ e.preventDefault(); setSettingsOpen(true); } };

$("modes").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.mode=b.dataset.mode;
  [...$("modes").children].forEach(x=>x.className = x===b?"on":"");
  render();
};
$("card").onclick=()=>{ if(state.current){ state.flipped=!state.flipped; renderCard(); } else { resetQueue(); renderCard(); } };
$("known").onclick=e=>{e.stopPropagation();next(true)};
$("again").onclick=e=>{e.stopPropagation();next(false)};
$("skip").onclick=e=>{e.stopPropagation();next(null)};
$("qnext").onclick=()=>newQuestion();
$("front").onchange=e=>{ state.front=e.target.value;
  if(!backLangs().length) state.backs=Object.keys(LANGS).filter(k=>k!==state.front);
  buildBackChips(); resetQueue(); state.qcur=null; render(); };
$("deflang").onchange=e=>{ state.def=e.target.value; render(); };
$("ui").onchange=e=>{ state.ui=e.target.value; buildCatChips(); applyI18n(); render(); };
$("allcats").onclick=()=>{ state.cats=new Set(DATA.map(d=>d.cat)); buildCatChips(); resetQueue(); render(); };
$("nocats").onclick=()=>{ state.cats=new Set(); buildCatChips(); resetQueue(); render(); };
$("search").oninput=()=>renderList();
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(state.mode!=="card") return;
  if(e.code==="Space"){ e.preventDefault(); $("card").click(); }
  if(e.key==="1") next(false);
  if(e.key==="2") next(true);
  if(e.key==="ArrowRight") next(null);
});

buildSelects(); buildBackChips(); buildCatChips(); setSettingsOpen(state.settingsOpen); applyI18n(); resetQueue(); render();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
