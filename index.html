<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomi och fysiologi — flashcards (sv / la / uk / ru)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
  --fg:#e8ecf1; --muted:#9aa6b4; --accent:#5aa9e6; --good:#4caf7d; --bad:#d4736b;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef1f5; --line:#d8dee6;
         --fg:#141a20; --muted:#5b6673; --accent:#1f6fb2; --good:#2f7d55; --bad:#a8443b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:10}
h1{font-size:17px;font-weight:600;margin:0 0 10px}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row + .row{margin-top:8px}
label{font-size:13px;color:var(--muted)}
select,input[type=text],button{font:inherit;color:var(--fg);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel2);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;
  text-align:center;cursor:pointer}
.front{font-size:30px;font-weight:600;line-height:1.25}
.frontlang{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.answers{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
.ans{display:flex;gap:10px;padding:5px 0;align-items:baseline}
.tag{flex:0 0 34px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.ansval{font-size:19px}
.def{margin-top:12px;font-size:14.5px;color:var(--muted)}
.cat{font-size:12px;color:var(--muted);margin-top:14px}
.hint{color:var(--muted);font-size:13px;margin-top:14px;text-align:center}
.controls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.controls button{padding:9px 18px}
.stats{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:var(--panel2)}
.qopt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px}
.qopt.right{background:var(--good);border-color:var(--good);color:#fff}
.qopt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.hidden{display:none}
footer{color:var(--muted);font-size:12.5px;padding:24px 18px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
footer a{color:var(--accent)}
.footlinks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:12px}
#footmeta{margin-top:12px;font-size:12px;line-height:1.6;opacity:.85;
  max-width:620px;margin-left:auto;margin-right:auto}

/* Hopfällbara urvalsinställningar. På telefon tar de annars nästan hela skärmen
   innan man ens ser ett kort, så där är de hopfällda från start. */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titlerow h1{margin:0}
#togglesettings{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:5px 11px;
  white-space:nowrap}
#togglesettings .chev{font-size:10px;line-height:1;transition:transform .15s ease}
#togglesettings[aria-expanded="false"] .chev{transform:rotate(-90deg)}
#settings{margin-top:10px}
#cats{max-height:none;overflow:visible}
#summary{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.5;cursor:pointer}
#summary b{color:var(--fg);font-weight:600}
#summary .sep{opacity:.5;margin:0 6px}

@media (max-width:700px){
  header{padding:10px 14px}
  .wrap{padding:14px}
  h1{font-size:16px}
  .row{gap:8px}
  .seg button{padding:6px 10px;font-size:13.5px}
  /* Kategorilistan är 16 chips lång — låt den rulla i stället för att trycka
     ned kortet under skärmkanten när panelen är utfälld. */
  #cats{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card{min-height:210px;padding:22px 18px}
  .front{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <div class="titlerow">
      <h1 id="title">Anatomi och fysiologi</h1>
      <button id="togglesettings" aria-expanded="true" aria-controls="settings">
        <span data-i18n="b_settings">Inställningar</span><span class="chev">▼</span>
      </button>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="seg" id="modes">
        <button data-mode="card" class="on" data-i18n="m_card">Flashcards</button>
        <button data-mode="quiz" data-i18n="m_quiz">Quiz</button>
        <button data-mode="list" data-i18n="m_list">Lista</button>
      </div>
    </div>
    <div id="settings">
      <div class="row">
        <label data-i18n="l_front">Fråga</label>
        <select id="front"></select>
        <label data-i18n="l_def">Förklaring</label>
        <select id="deflang"></select>
        <label data-i18n="l_ui">Gränssnitt</label>
        <select id="ui"></select>
      </div>
      <div class="row">
        <label data-i18n="l_back">Svar</label>
        <span id="backs" class="chips" style="margin-top:0"></span>
      </div>
      <div class="chips" id="cats"></div>
      <div class="row" style="margin-top:10px">
        <button id="allcats" data-i18n="b_all">Alla</button>
        <button id="nocats" data-i18n="b_none">Inga</button>
        <span id="count" style="font-size:13px;color:var(--muted)"></span>
      </div>
    </div>
    <div id="summary" class="hidden" role="button" tabindex="0"></div>
  </div>
</header>

<div class="wrap">
  <div id="view_card">
    <div class="card" id="card">
      <div>
        <div class="frontlang" id="flabel"></div>
        <div class="front" id="fterm"></div>
      </div>
      <div class="answers hidden" id="answers"></div>
      <div class="hint" id="hint" data-i18n="h_tap">Klicka eller tryck mellanslag för att vända</div>
    </div>
    <div class="controls">
      <button id="again" data-i18n="b_again">Repetera</button>
      <button id="known" class="primary" data-i18n="b_known">Kan</button>
      <button id="skip" data-i18n="b_skip">Hoppa över</button>
    </div>
    <div class="stats">
      <span><span data-i18n="s_seen">Visade</span>: <b id="s_seen">0</b></span>
      <span><span data-i18n="s_known">Kan</span>: <b id="s_known">0</b></span>
      <span><span data-i18n="s_left">Kvar</span>: <b id="s_left">0</b></span>
    </div>
  </div>

  <div id="view_quiz" class="hidden">
    <div class="card" style="cursor:default;min-height:auto;display:block;text-align:left">
      <div class="frontlang" id="qlabel"></div>
      <div class="front" id="qterm" style="text-align:left"></div>
      <div id="qopts" style="margin-top:18px"></div>
      <div class="def hidden" id="qdef"></div>
    </div>
    <div class="controls"><button id="qnext" class="primary" data-i18n="b_next">Nästa</button></div>
    <div class="stats">
      <span><span data-i18n="s_q">Frågor</span>: <b id="q_n">0</b></span>
      <span><span data-i18n="s_right">Rätt</span>: <b id="q_r">0</b></span>
    </div>
  </div>

  <div id="view_list" class="hidden">
    <input type="text" id="search" placeholder="Sök..." style="width:100%">
    <div style="overflow-x:auto"><table id="tbl"></table></div>
  </div>
</div>

<footer>
  <span data-i18n="f_note">Termlista för grundläggande anatomi, fysiologi och medicinsk terminologi.</span>
  <span id="total"></span>
  <div class="footlinks">
    <a id="dl" href="data/anatomi-4sprak.apkg" download data-i18n="f_download">Ladda ner Anki-deck (.apkg)</a>
    <a href="https://github.com/oluies/anatomi-4sprak" data-i18n="f_source">Källkod på GitHub</a>
    <a href="https://donate.wikimedia.org/" rel="noopener" data-i18n="f_donate">Stöd Wikipedia</a>
  </div>
  <div id="footmeta"></div>
</footer>

<script>
const DATA = [{"id":"abdomen","cat":"Kroppens organisation och riktningstermer","sv":"buk","la":"abdomen","uk":"живіт","ru":"живот","def_sv":"Bålens del mellan bröstkorgen och bäckenet.","def_uk":"Частина тулуба між грудною кліткою та тазом.","def_ru":"Часть туловища между грудной клеткой и тазом.","n":1},{"id":"antebrachium","cat":"Kroppens organisation och riktningstermer","sv":"underarm","la":"antebrachium","uk":"передпліччя","ru":"предплечье","def_sv":"Armens del mellan armbågen och handleden.","def_uk":"Частина руки між ліктем і променево-зап'ястковим суглобом.","def_ru":"Часть руки между локтем и лучезапястным суставом.","n":2},{"id":"anterior","cat":"Kroppens organisation och riktningstermer","sv":"anterior (främre)","la":"anterior","uk":"передній","ru":"передний","def_sv":"Läge närmare kroppens framsida.","def_uk":"Розташування ближче до передньої поверхні тіла.","def_ru":"Расположение ближе к передней поверхности тела.","n":3},{"id":"brachium","cat":"Kroppens organisation och riktningstermer","sv":"överarm","la":"brachium","uk":"плече","ru":"плечо","def_sv":"Armens del mellan axelleden och armbågen.","def_uk":"Частина руки між плечовим суглобом і ліктем.","def_ru":"Часть руки между плечевым суставом и локтем.","n":4},{"id":"caput","cat":"Kroppens organisation och riktningstermer","sv":"huvud","la":"caput","uk":"голова","ru":"голова","def_sv":"Kroppens översta del med hjärna, ansikte och sinnesorgan.","def_uk":"Найвища частина тіла з мозком, обличчям та органами чуття.","def_ru":"Верхняя часть тела с мозгом, лицом и органами чувств.","n":5},{"id":"caudalis","cat":"Kroppens organisation och riktningstermer","sv":"kaudal (mot svansbenet)","la":"caudalis","uk":"каудальний (хвостовий)","ru":"каудальный (хвостовой)","def_sv":"Läge mot svansbenet, alltså nedåt på bålen.","def_uk":"Розташування у напрямку до куприка, тобто донизу на тулубі.","def_ru":"Расположение в направлении к копчику, то есть книзу на туловище.","n":6},{"id":"cavitas-abdominis","cat":"Kroppens organisation och riktningstermer","sv":"bukhålan","la":"cavitas abdominis","uk":"черевна порожнина","ru":"брюшная полость","def_sv":"Hålrummet under diafragman med magsäck, tarmar, lever och njurar.","def_uk":"Порожнина під діафрагмою зі шлунком, кишечником, печінкою та нирками.","def_ru":"Полость под диафрагмой с желудком, кишечником, печенью и почками.","n":7},{"id":"cavitas-cranii","cat":"Kroppens organisation och riktningstermer","sv":"skallhålan","la":"cavitas cranii","uk":"порожнина черепа","ru":"полость черепа","def_sv":"Hålrummet inuti skallen som innehåller hjärnan.","def_uk":"Порожнина всередині черепа, у якій міститься головний мозок.","def_ru":"Полость внутри черепа, в которой находится головной мозг.","n":8},{"id":"cavitas-thoracis","cat":"Kroppens organisation och riktningstermer","sv":"brösthålan","la":"cavitas thoracis","uk":"грудна порожнина","ru":"грудная полость","def_sv":"Hålrummet i bröstkorgen med hjärta, lungor och matstrupe.","def_uk":"Порожнина грудної клітки із серцем, легенями та стравоходом.","def_ru":"Полость грудной клетки с сердцем, лёгкими и пищеводом.","n":9},{"id":"cellula","cat":"Kroppens organisation och riktningstermer","sv":"cell","la":"cellula","uk":"клітина","ru":"клетка","def_sv":"Kroppens minsta levande byggsten.","def_uk":"Найменша жива структурна одиниця тіла.","def_ru":"Наименьшая живая структурная единица тела.","n":10},{"id":"collum","cat":"Kroppens organisation och riktningstermer","sv":"hals","la":"collum","uk":"шия","ru":"шея","def_sv":"Kroppsdelen mellan huvudet och bröstkorgen.","def_uk":"Частина тіла між головою та грудною кліткою.","def_ru":"Часть тела между головой и грудной клеткой.","n":11},{"id":"cranialis","cat":"Kroppens organisation och riktningstermer","sv":"kranial (mot huvudet)","la":"cranialis","uk":"краніальний (черепний)","ru":"краниальный (черепной)","def_sv":"Läge mot huvudet.","def_uk":"Розташування у напрямку до голови.","def_ru":"Расположение в направлении к голове.","n":12},{"id":"crus","cat":" :"textus muscularis striatus cardiacus","uk":"серцева м'язова тканина (міокард)","ru":"сердечная мышечная ткань (миокард)","def_sv":"Tvärstrimmig muskelvävnad i hjärtat som arbetar utan viljans kontroll.","def_uk":"Посмугована м'язова тканина серця, яка працює без контролю волі.","def_ru":"Поперечнополосатая мышечная ткань сердца, работающая без контроля воли.","n":57},{"id":"textus-muscularis-striatus-skeletalis","cat":"Cellen och vävnader","sv":"tvärstrimmig muskelvävnad (skelettmuskulatur)","la":"textus muscularis striatus skeletalis","uk":"посмугована (скелетна) м'язова тканина","ru":"поперечнополосатая (скелетная) мышечная ткань","def_sv":"Muskelvävnad fäst vid skelettet som styrs med viljan.","def_uk":"М'язова тканина, прикріплена до скелета, яка керується волею.","def_ru":"Мышечная ткань, прикреплённая к скелету, управляемая волей.","n":58},{"id":"textus-nervosus","cat":"Cellen och vävnader","sv":"nervvävnad","la":"textus nervosus","uk":"нервова тканина","ru":"нервная ткань","def_sv":"Vävnad av nervceller som leder och bearbetar signaler.","def_uk":"Тканина з нервових клітин, що проводить та обробляє сигнали.","def_ru":"Ткань из нервных клеток, проводящая и обрабатывающая сигналы.","n":59},{"id":"textus-osseus","cat":"Cellen och vävnader","sv":"benvävnad","la":"textus osseus","uk":"кісткова тканина","ru":"костная ткань","def_sv":"Hård vävnad med kalksalter som bygger upp skelettet.","def_uk":"Тверда тканина з солями кальцію, яка утворює скелет.","def_ru":"Твёрдая ткань с солями кальция, образующая скелет.","n":60},{"id":"emi","cat":"Medicinsk terminologi","sv":"-emi (tillstånd i blodet)","la":"-aemia","uk":"-емія (стан крові)","ru":"-емия (состояние крови)","def_sv":"Ändelse som beskriver ett tillstånd i blodet, till exempel anemi.","def_uk":"Суфікс, що описує стан крові, наприклад анемія.","def_ru":"Суффикс, описывающий состояние крови, например анемия.","n":61},{"id":"algi","cat":"Medicinsk terminologi","sv":"-algi (smärta)","la":"-algia","uk":"-алгія (біль)","ru":"-алгия (боль)","def_sv":"Ändelse som betyder smärta, till exempel neuralgi som är nervsmärta.","def_uk":"Суфікс, що означає біль, наприклад невралгія, тобто біль у нерві.","def_ru":"Суффикс, означающий боль, например невралгия, то есть боль в нерве.","n":62},{"id":"ektomi","cat":"Medicinsk terminologi","sv":"-ektomi (bortoperation av organ)","la":"-ectomia","uk":"-ектомія (видалення органу)","ru":"-эктомия (удаление органа)","def_sv":"Ändelse som betyder att ett organ opereras bort, till exempel appendektomi.","def_uk":"Суфікс, що означає хірургічне видалення органу, наприклад апендектомія.","def_ru":"Суффикс, означающий хирургическое удаление органа, например аппендэктомия.","n":63},{"id":"grafi","cat":"Medicinsk terminologi","sv":"-grafi (bild, registrering)","la":"-graphia","uk":"-графія (зображення, запис)","ru":"-графия (изображение, запись)","def_sv":"Ändelse som betyder bild eller registrering, till exempel mammografi.","def_uk":"Суфікс, що означає зображення або запис, наприклад мамографія.","def_ru":"Суффикс, означающий изображение или запись, например маммография.","n":64},{"id":"itis","cat":"Medicinsk terminologi","sv":"-it (inflammation)","la":"-itis","uk":"-іт (запалення)","ru":"-ит (воспаление)","def_sv":"Ändelse som betyder inflammation, till exempel bronkit i luftrören.","def_uk":"Суфікс, що означає запалення, наприклад бронхіт у бронхах.","def_ru":"Суффикс, означающий воспаление, например бронхит в бронхах.","n":65},{"id":"pati","cat":"Medicinsk terminologi","sv":"-pati (sjukdom, lidande)","la":"-pathia","uk":"-патія (захворювання)","ru":"-патия (заболевание)","def_sv":"Ändelse som betyder sjukdom i ett organ, till exempel neuropati.","def_uk":"Суфікс, що означає захворювання органу, наприклад нейропатія.","def_ru":"Суффикс, означающий заболевание органа, например нейропатия.","n":66},{"id":"plegi","cat":"Medicinsk terminologi","sv":"-plegi (förlamning)","la":"-plegia","uk":"-плегія (параліч)","ru":"-плегия (паралич)","def_sv":"Ändelse som betyder förlamning, till exempel hemiplegi i ena kroppshalvan.","def_uk":"Суфікс, що означає параліч, наприклад геміплегія однієї половини тіла.","def_ru":"Суффикс, означающий паралич, например гемиплегия одной половины тела.","n":67},{"id":"pne","cat":"Medicinsk terminologi","sv":"-pné (andning)","la":"-pnoea","uk":"-пное (дихання)","ru":"-пноэ (дыхание)","def_sv":"Ändelse som handlar om andningen, till exempel dyspné som är andnöd.","def_uk":"Суфікс, що стосується дихання, наприклад диспное, тобто задишка.","def_ru":"Суффикс, относящийся к дыханию, например диспноэ, то есть одышка.","n":68},{"id":"skopi","cat":"Medicinsk terminologi","sv":"-skopi (undersökning med instrument)","la":"-scopia","uk":"-скопія (огляд приладом)","ru":"-скопия (осмотр прибором)","def_sv":"Ändelse som betyder undersökning med instrument inifrån, till exempel gastroskopi.","def_uk":"Суфікс, що означає огляд зсередини за допомогою приладу, наприклад гастроскопія.","def_ru":"Суффикс, означающий осмотр изнутри с помощью прибора, например гастроскопия.","n":69},{"id":"stomi","cat":"Medicinsk terminologi","sv":"-stomi (konstgjord öppning)","la":"-stomia","uk":"-стомія (штучний отвір)","ru":"-стомия (искусственное отверстие)","def_sv":"Ändelse som betyder konstgjord öppning ut mot huden, till exempel kolostomi.","def_uk":"Суфікс, що означає штучний отвір назовні через шкіру, наприклад колостома.","def_ru":"Суффикс, означающий искусственное отверстие наружу через кожу, например колостома.","n":70},{"id":"tomi","cat":"Medicinsk terminologi","sv":"-tomi (snitt, öppning)","la":"-tomia","uk":"-томія (розтин)","ru":"-томия (рассечение)","def_sv":"Ändelse som betyder snitt i vävnad eller organ, till exempel laparotomi.","def_uk":"Суфікс, що означає розтин тканини або органу, наприклад лапаротомія.","def_ru":"Суффикс, означающий рассечение ткани или органа, например лапаротомия.","n":71},{"id":"uri","cat":"Medicinsk terminologi","sv":"-uri (tillstånd i urinen)","la":"-uria","uk":"-урія (стан сечі)","ru":"-урия (состояние мочи)","def_sv":"Ändelse som beskriver urinen eller urinmängden, till exempel polyuri.","def_uk":"Суфікс, що описує сечу або її кількість, наприклад поліурія.","def_ru":"Суффикс, описывающий мочу или её количество, например полиурия.","n":72},{"id":"a-an","cat":"Medicinsk terminologi","sv":"a-/an- (utan, brist på)","la":"a-/an-","uk":"а-/ан- (без, відсутність)","ru":"а-/ан- (без, отсутствие)","def_sv":"Förled som betyder utan eller avsaknad av något, till exempel anemi.","def_uk":"Префікс, що означає без або відсутність чогось, наприклад анемія.","def_ru":"Приставка, означающая без или отсутствие чего-либо, например анемия.","n":73},{"id":"brady","cat":"Medicinsk terminologi","sv":"brady- (långsam)","la":"brady-","uk":"браді- (повільний)","ru":"бради- (медленный)","def_sv":"Förled som betyder långsam, till exempel bradykardi som är låg puls.","def_uk":"Префікс, що означає повільний, наприклад брадикардія, тобто низький пульс.","def_ru":"Приставка, означающая медленный, например брадикардия, то есть низкий пульс.","n":74},{"id":"cardia","cat":"Medicinsk terminologi","sv":"hjärta","la":"cardia (kardio-)","uk":"серце (кардіо-)","ru":"сердце (кардио-)","def_sv":"Ordled som betyder hjärta, till exempel kardiologi, läran om hjärtat.","def_uk":"Корінь, що означає серце, наприклад кардіологія, наука про серце.","def_ru":"Корень, означающий сердце, например кардиология, наука о сердце.","n":75},{"id":"derma","cat":"Medicinsk terminologi","sv":"hud","la":"derma (dermato-)","uk":"шкіра (дермато-)","ru":"кожа (дермато-)","def_sv":"Ordled som betyder hud, till exempel dermatit, inflammation i huden.","def_uk":"Корінь, що означає шкіру, наприклад дерматит, запалення шкіри.","def_ru":"Корень, означающий кожу, например дерматит, воспаление кожи.","n":76},{"id":"dys","cat":"Medicinsk terminologi","sv":"dys- (svårighet, störd funktion)","la":"dys-","uk":"дис- (утруднення, порушення)","ru":"дис- (затруднение, нарушение)","def_sv":"Förled som betyder svårighet eller störd funktion, till exempel dysfagi.","def_uk":"Префікс, що означає утруднення або порушення функції, наприклад дисфагія.","def_ru":"Приставка, означающая затруднение или нарушение функции, например дисфагия.","n":77},{"id":"endo","cat":"Medicinsk terminologi","sv":"endo- (inuti, inne i)","la":"endo-","uk":"ендо- (усередині)","ru":"эндо- (внутри)","def_sv":"Förled som betyder inuti något, till exempel endokardium innerst i hjärtat.","def_uk":"Префікс, що означає усередині чогось, наприклад ендокард усередині серця.","def_ru":"Приставка, означающая внутри чего-либо, например эндокард внутри сердца.","n":78},{"id":"epi","cat":"Medicinsk terminologi","sv":"epi- (på, ovanpå)","la":"epi-","uk":"епі- (на, поверх)","ru":"эпи- (на, поверх)","def_sv":"Förled som betyder på eller ovanpå, till exempel epidermis ytterst i huden.","def_uk":"Префікс, що означає на або поверх, наприклад епідерміс, зовнішній шар шкіри.","def_ru":"Приставка, означающая на или поверх, например эпидермис, наружный слой кожи.","n":79},{"id":"gastro","cat":"Medicinsk terminologi","sv":"magsäck","la":"gaster (gastro-)","uk":"шлунок (гастро-)","ru":"желудок (гастро-)","def_sv":"Ordled som betyder magsäck, till exempel gastroskopi som undersöker magsäcken.","def_uk":"Корінь, що означає шлунок, наприклад гастроскопія, огляд шлунка.","def_ru":"Корень, означающий желудок, например гастроскопия, осмотр желудка.","n":80},{"id":"hepato","cat":"Medicinsk terminologi","sv":"lever","la":"hepar (hepato-)","uk":"печінка (гепато-)","ru":"печень (гепато-)","def_sv":"Ordled som betyder lever, till exempel hepatit, inflammation i levern.","def_uk":"Корінь, що означає печінку, наприклад гепатит, запалення печінки.","def_ru":"Корень, означающий печень, например гепатит, воспаление печени.","n":81},{"id":"hyper","cat":"Medicinsk terminologi","sv":"hyper- (över, förhöjd)","la":"hyper-","uk":"гіпер- (над, підвищений)","ru":"гипер- (над, повышенный)","def_sv":"Förled som betyder för mycket eller förhöjd, till exempel hypertoni.","def_uk":"Префікс, що означає надмірний або підвищений, наприклад гіпертонія.","def_ru":"Приставка, означающая избыточный или повышенный, например гипертония.","n":82},{"id":"hypo","cat":"Medicinsk terminologi","sv":"hypo- (under, sänkt)","la":"hypo-","uk":"гіпо- (під, знижений)","ru":"гипо- (под, пониженный)","def_sv":"Förled som betyder för lite eller sänkt, till exempel hypotoni.","def_uk":"Префікс, що означає недостатній або знижений, наприклад гіпотонія.","def_ru":"Приставка, означающая недостаточный или пониженный, например гипотония.","n":83},{"id":"inter","cat":"Medicinsk terminologi","sv":"inter- (mellan)","la":"inter-","uk":"інтер- (між)","ru":"интер- (между)","def_sv":"Förled som betyder mellan, till exempel interkostal som betyder mellan revbenen.","def_uk":"Префікс, що означає між, наприклад міжреберний, тобто між ребрами.","def_ru":"Приставка, означающая между, например межреберный, то есть между ребрами.","n":84},{"id":"intra","cat":"Medicinsk terminologi","sv":"intra- (inne i, inuti)","la":"intra-","uk":"інтра- (усередині)","ru":"интра- (внутри)","def_sv":"Förled som betyder inne i, till exempel intravenös inne i venen.","def_uk":"Префікс, що означає всередині, наприклад внутрішньовенний, тобто всередині вени.","def_ru":"Приставка, означающая внутри, например внутривенный, то есть внутри вены.","n":85},{"id":"nefro-reno","cat":"Medicinsk terminologi","sv":"njure","la":"nephros (nefro-) / ren (reno-)","uk":"нирка (нефро-, рено-)","ru":"почка (нефро-, рено-)","def_sv":"Ordled som betyder njure, till exempel nefrit, inflammation i njuren.","def_uk":"Корінь, що означає нирку, наприклад нефрит, запалення нирки.","def_ru":"Корень, означающий почку, например нефрит, воспаление почки.","n":86},{"id":"oligo","cat":"Medicinsk terminologi","sv":"oligo- (få, för lite)","la":"oligo-","uk":"оліго- (мало, недостатньо)","ru":"олиго- (мало, недостаточно)","def_sv":"Förled som betyder få eller för lite, till exempel oliguri.","def_uk":"Префікс, що означає мало або недостатньо, наприклад олігурія.","def_ru":"Приставка, означающая мало или недостаточно, например олигурия.","n":87},{"id":"osteo","cat":"Medicinsk terminologi","sv":"ben, benvävnad","la":"os (osteo-)","uk":"кістка (остео-)","ru":"кость (остео-)","def_sv":"Ordled som betyder ben eller benvävnad, till exempel osteoporos.","def_uk":"Корінь, що означає кістку або кісткову тканину, наприклад остеопороз.","def_ru":"Корень, означающий кость или костную ткань, например остеопороз.","n":88},{"id":"peri","cat":"Medicinsk terminologi","sv":"peri- (runt omkring)","la":"peri-","uk":"пери- (навколо)","ru":"пери- (вокруг)","def_sv":"Förled som betyder runt omkring något, till exempel perikardium runt hjärtat.","def_uk":"Префікс, що означає навколо чогось, наприклад перикард навколо серця.","def_ru":"Приставка, означающая вокруг чего-либо, например перикард вокруг сердца.","n":89},{"id":"poly","cat":"Medicinsk terminologi","sv":"poly- (många, mycket)","la":"poly-","uk":"полі- (багато)","ru":"поли- (много)","def_sv":"Förled som betyder många eller mycket, till exempel polyuri.","def_uk":"Префікс, що означає багато або надмірно, наприклад поліурія.","def_ru":"Приставка, означающая много или избыточно, например полиурия.","n":90},{"id":"post","cat":"Medicinsk terminologi","sv":"post- (efter)","la":"post-","uk":"пост- (після)","ru":"пост- (после)","def_sv":"Förled som betyder efter, till exempel postoperativ som betyder efter operation.","def_uk":"Префікс, що означає після, наприклад післяопераційний, тобто після операції.","def_ru":"Приставка, означающая после, например послеоперационный, то есть после операции.","n":91},{"id":"pre","cat":"Medicinsk terminologi","sv":"pre- (före)","la":"pre-/prae-","uk":"пре- (перед, до)","ru":"пре- (перед, до)","def_sv":"Förled som betyder före, till exempel preoperativ som betyder före operation.","def_uk":"Префікс, що означає до, наприклад передопераційний, тобто перед операцією.","def_ru":"Приставка, означающая до, например предоперационный, то есть перед операцией.","n":92},{"id":"pulmo","cat":"Medicinsk terminologi","sv":"lunga","la":"pulmo (pulmo-)","uk":"легеня (пульмо-)","ru":"лёгкое (пульмо-)","def_sv":"Ordled som betyder lunga, till exempel pulmonell som rör lungorna.","def_uk":"Корінь, що означає легеню, наприклад пульмональний, тобто легеневий.","def_ru":"Корень, означающий лёгкое, например пульмональный, то есть лёгочный.","n":93},{"id":"sub","cat":"Medicinsk terminologi","sv":"sub- (under, nedanför)","la":"sub-","uk":"суб- (під, нижче)","ru":"суб- (под, ниже)","def_sv":"Förled som betyder under, till exempel subkutan som betyder under huden.","def_uk":"Префікс, що означає під, наприклад підшкірний, тобто розташований під шкірою.","def_ru":"Приставка, означающая под, например подкожный, то есть расположенный под кожей.","n":94},{"id":"tachy","cat":"Medicinsk terminologi","sv":"taky- (snabb)","la":"tachy-","uk":"тахі- (швидкий)","ru":"тахи- (быстрый)","def_sv":"Förled som betyder snabb, till exempel takykardi som är hög puls.","def_uk":"Префікс, що означає швидкий, наприклад тахікардія, тобто високий пульс.","def_ru":"Приставка, означающая быстрый, например тахикардия, то есть высокий пульс.","n":95},{"id":"atlas","cat":"Skelettet","sv":"atlas (första halskotan)","la":"atlas","uk":"атлант","ru":"атлант","def_sv":"Atlas är första halskotan och bär upp huvudet.","def_uk":"Атлант - перший шийний хребець, який підтримує голову.","def_ru":"Атлант - первый шейный позвонок, который поддерживает голову.","n":96},{"id":"axis","cat":"Skelettet","sv":"axis (andra halskotan)","la":"axis","uk":"осьовий хребець (аксис)","ru":"осевой позвонок (аксис)","def_sv":"Axis är andra halskotan och gör att huvudet kan vridas.","def_uk":"Аксис - другий шийний хребець, що дозволяє повертати голову.","def_ru":"Аксис - второй шейный позвонок, позволяющий поворачивать голову.","n":97},{"id":"calcaneus","cat":"Skelettet","sv":"hälben","la":"calcaneus","uk":"п'яткова кістка","ru":"пяточная кость","def_sv":"Hälbenet är fotens största ben och bildar hälen.","def_uk":"П'яткова кістка - найбільша кістка стопи, утворює п'яту.","def_ru":"Пяточная кость - самая крупная кость стопы, образует пятку.","n":98},{"id":"cartilago","cat":"Skelettet","sv":"brosk","la":"cartilago","uk":"хрящ","ru":"хрящ","def_sv":"Brosk är en mjuk stödjevävnad som täcker ledytorna.","def_uk":"Хрящ - м'яка опорна тканина, що вкриває суглобові поверхні.","def_ru":"Хрящ - мягкая опорная ткань, покрывающая суставные поверхности.","n":99},{"id":"clavicula","cat":"Skelettet","sv":"nyckelben","la":"clavicula","uk":"ключиця","ru":"ключица","def_sv":"Nyckelbenet förbinder bröstbenet med skulderbladet.","def_uk":"Ключиця з'єднує грудину з лопаткою.","def_ru":"Ключица соединяет грудину с лопаткой.","n":100},{"id":"columna-vertebralis","cat":"Skelettet","sv":"ryggrad (kotpelare)","la":"columna vertebralis","uk":"хребет (хребтовий стовп)","ru":"позвоночник (позвоночный столб)","def_sv":"Ryggraden består av kotor, bär upp kroppen och skyddar ryggmärgen.","def_uk":"Хребет складається з хребців, підтримує тіло та захищає спинний мозок.","def_ru":"Позвоночник состоит из позвонков, поддерживает тело и защищает спинной мозг.","n":101},{"id":"costa","cat":"Skelettet","sv":"revben","la":"costa","uk":"ребро","ru":"ребро","def_sv":"Revbenen är tolv par böjda ben som skyddar brösthålans organ.","def_uk":"Ребра - дванадцять пар вигнутих кісток, що захищають органи грудної порожнини.","def_ru":"Рёбра - двенадцать пар изогнутых костей, защищающих органы грудной полости.","n":102},{"id":"cranium","cat":"Skelettet","sv":"kranium (skalle)","la":"cranium","uk":"череп","ru":"череп","def_sv":"Kraniet är skallens benstomme som skyddar hjärnan och sinnesorganen.","def_uk":"Череп - кісткова основа голови, що захищає мозок і органи чуття.","def_ru":"Череп - костная основа головы, защищающая мозг и органы чувств.","n":103},{"id":"discus-intervertebralis","cat":"Skelettet","sv":"mellankotskiva (disk)","la":"discus intervertebralis","uk":"міжхребцевий диск","ru":"межпозвонковый диск","def_sv":"Mellankotskivan ligger mellan kotorna och dämpar stötar.","def_uk":"Міжхребцевий диск лежить між хребцями та пом'якшує поштовхи.","def_ru":"Межпозвонковый диск лежит между позвонками и смягчает толчки.","n":104},{"id":"fibula","cat":"Skelettet","sv":"vadben","la":"fibula","uk":"малогомілкова кістка","ru":"малоберцовая кость","def_sv":"Vadbenet är underbenets smala ben på utsidan.","def_uk":"Малогомілкова кістка - тонка кістка гомілки із зовнішнього боку.","def_ru":"Малоберцовая кость - тонкая кость голени с наружной стороны.","n":105},{"id":"humerus","cat":"Skelettet","sv":"överarmsben","la":"humerus","uk":"плечова кістка","ru":"плечевая кость","def_sv":"Överarmsbenet går från axelleden ner till armbågsleden.","def_uk":"Плечова кістка йде від плечового суглоба до ліктьового.","def_ru":"Плечевая кость идёт от плечевого сустава до локтевого.","n":106},{"id":"mandibula","cat":"Skelettet","sv":"underkäke","la":"mandibula","uk":"нижня щелепа","ru":"нижняя челюсть","def_sv":"Underkäken är skallens enda rörliga ben och bär de nedre tänderna.","def_uk":"Нижня щелепа - єдина рухома кістка черепа, несе нижні зуби.","def_ru":"Нижняя челюсть - единственная подвижная кость черепа, несёт нижние зубы.","n":107},{"id":"maxilla","cat":"Skelettet","sv":"överkäksben","la":"maxilla","uk":"верхня щелепа","ru":"верхняя челюсть","def_sv":"Överkäksbenet bär de övre tänderna och bildar största delen av gommen.","def_uk":"Верхня щелепа несе верхні зуби й утворює більшу частину піднебіння.","def_ru":"Верхняя челюсть несёт верхние зубы и образует большую часть нёба.","n":108},{"id":"medulla-ossium","cat":"Skelettet","sv":"benmärg","la":"medulla ossium","uk":"кістковий мозок","ru":"костный мозг","def_sv":"Benmärgen finns inuti benen och bildar blodkroppar.","def_uk":"Кістковий мозок міститься всередині кісток і утворює клітини крові.","def_ru":"Костный мозг находится внутри костей и образует клетки крови.","n":109},{"id":"os-coccygis","cat":"Skelettet","sv":"svansben (coccyx)","la":"os coccygis","uk":"куприк","ru":"копчик","def_sv":"Svansbenet är ryggradens nedersta del med några små sammanvuxna kotor.","def_uk":"Куприк - нижня частина хребта з кількох дрібних зрослих хребців.","def_ru":"Копчик - нижняя часть позвоночника из нескольких мелких сросшихся позвонков.","n":110},{"id":"os-coxae","cat":"Skelettet","sv":"höftben","la":"os coxae","uk":"кульшова кістка","ru":"тазовая кость","def_sv":"Höftbenet består av tarmben, sittben och blygdben.","def_uk":"Кульшова кістка складається з клубової, сідничої та лобкової кісток.","def_ru":"Тазовая кость состоит из подвздошной, седалищной и лобковой костей.","n":111},{"id":"os-femoris","cat":"Skelettet","sv":"lårben (femur)","la":"os femoris","uk":"стегнова кістка","ru":"бедренная кость","def_sv":"Lårbenet är kroppens längsta och starkaste ben.","def_uk":"Стегнова кістка - найдовша й найміцніша кістка тіла.","def_ru":"Бедренная кость - самая длинная и прочная кость тела.","n":112},{"id":"os-frontale","cat":"Skelettet","sv":"pannben","la":"os frontale","uk":"лобова кістка","ru":"лобная кость","def_sv":"Pannbenet bildar pannan och främre delen av skallens tak.","def_uk":"Лобова кістка утворює чоло та передню частину склепіння черепа.","def_ru":"Лобная кость образует лоб и переднюю часть свода черепа.","n":113},{"id":"os-ilium","cat":"Skelettet","sv":"tarmben (ilium)","la":"os ilium","uk":"клубова кістка","ru":"подвздошная кость","def_sv":"Tarmbenet är höftbenets breda övre del.","def_uk":"Клубова кістка - широка верхня частина кульшової кістки.","def_ru":"Подвздошная кость - широкая верхняя часть тазовой кости.","n":114},{"id":"os-ischii","cat":"Skelettet","sv":"sittben (ischium)","la":"os ischii","uk":"сіднича кістка","ru":"седалищная кость","def_sv":"Sittbenet är höftbenets nedre bakre del som man sitter på.","def_uk":"Сіднича кістка - нижня задня частина кульшової кістки, на якій сидять.","def_ru":"Седалищная кость - нижняя задняя часть тазовой кости, на которой сидят.","n":115},{"id":"os-nasale","cat":"Skelettet","sv":"näsben","la":"os nasale","uk":"носова кістка","ru":"носовая кость","def_sv":"Näsbenet bildar den övre benartade delen av näsryggen.","def_uk":"Носова кістка утворює верхню кісткову частину спинки носа.","def_ru":"Носовая кость образует верхнюю костную часть спинки носа.","n":116},{"id":"os-occipitale","cat":"Skelettet","sv":"nackben","la":"os occipitale","uk":"потилична кістка","ru":"затылочная кость","def_sv":"Nackbenet bildar skallens bakre del och har det stora nackhålet.","def_uk":"Потилична кістка утворює задню частину черепа і має великий отвір.","def_ru":"Затылочная кость образует заднюю часть черепа и имеет большое отверстие.","n":117},{"id":"os-parietale","cat":"Skelettet","sv":"hjässben","la":"os parietale","uk":"тім'яна кістка","ru":"теменная кость","def_sv":"Hjässbenet bildar en stor del av skallens tak och sidor.","def_uk":"Тім'яна кістка утворює значну частину склепіння та бічних стінок черепа.","def_ru":"Теменная кость образует большую часть свода и боковых стенок черепа.","n":118},{"id":"os-pubis","cat":"Skelettet","sv":"blygdben (pubis)","la":"os pubis","uk":"лобкова кістка","ru":"лобковая кость","def_sv":"Blygdbenet är höftbenets främre del vid bäckenets mittfog.","def_uk":"Лобкова кістка - передня частина кульшової кістки біля лобкового симфізу.","def_ru":"Лобковая кость - передняя часть тазовой кости у лобкового симфиза.","n":119},{"id":"os-sacrum","cat":"Skelettet","sv":"korsben (sakrum)","la":"os sacrum","uk":"крижова кістка","ru":"крестец","def_sv":"Korsbenet består av fem sammanvuxna kotor och ingår i bäckenet.","def_uk":"Крижова кістка складається з п'яти зрослих хребців і входить до таза.","def_ru":"Крестец состоит из пяти сросшихся позвонков и входит в состав таза.","n":120},{"id":"os-temporale","cat":"Skelettet","sv":"tinningben","la":"os temporale","uk":"скронева кістка","ru":"височная кость","def_sv":"Tinningbenet ligger vid tinningen och innehåller hörsel- och balansorganet.","def_uk":"Скронева кістка лежить у ділянці скроні та містить органи слуху й рівноваги.","def_ru":"Височная кость лежит в области виска и содержит органы слуха и равновесия.","n":121},{"id":"os-zygomaticum","cat":"Skelettet","sv":"okben","la":"os zygomaticum","uk":"вилична кістка","ru":"скуловая кость","def_sv":"Okbenet bildar kindknotan och nedre delen av ögonhålan.","def_uk":"Вилична кістка утворює вилицю та нижню частину очної ямки.","def_ru":"Скуловая кость образует скулу и нижнюю часть глазницы.","n":122},{"id":"ossa-carpi","cat":"Skelettet","sv":"handlovsben (karpalben)","la":"ossa carpi","uk":"кістки зап'ястка","ru":"кости запястья","def_sv":"Handlovsbenen är åtta små ben mellan underarmen och mellanhanden.","def_uk":"Кістки зап'ястка - вісім дрібних кісток між передпліччям і п'ястком.","def_ru":"Кости запястья - восемь мелких костей между предплечьем и пястью.","n":123},{"id":"ossa-metacarpi","cat":"Skelettet","sv":"mellanhandsben (metakarpalben)","la":"ossa metacarpi","uk":"п'ясткові кістки","ru":"пястные кости","def_sv":"Mellanhandsbenen är fem ben som bildar handflatans stomme.","def_uk":"П'ясткові кістки - п'ять кісток, що утворюють основу долоні.","def_ru":"Пястные кости - пять костей, образующих основу ладони.","n":124},{"id":"ossa-metatarsi","cat":"Skelettet","sv":"mellanfotsben (metatarsalben)","la":"ossa metatarsi","uk":"плеснові кістки","ru":"плюсневые кости","def_sv":"Mellanfotsbenen är fem ben mellan fotroten och tårna.","def_uk":"Плеснові кістки - п'ять кісток між заплесном і пальцями стопи.","def_ru":"Плюсневые кости - пять костей между предплюсной и пальцами стопы.","n":125},{"id":"ossa-tarsi","cat":"Skelettet","sv":"fotrotsben (tarsalben)","la":"ossa tarsi","uk":"кістки заплесна","ru":"кости предплюсны","def_sv":"Fotrotsbenen är sju ben i fotens bakre del.","def_uk":"Кістки заплесна - сім кісток у задній частині стопи.","def_ru":"Кости предплюсны - семь костей в задней части стопы.","n":126},{"id":"osteoporosis","cat":"Skelettet","sv":"benskörhet (osteoporos)","la":"osteoporosis","uk":"остеопороз","ru":"остеопороз","def_sv":"Benskörhet innebär att benvävnaden blir svag och lätt bryts.","def_uk":"Остеопороз - стан, коли кісткова тканина слабшає й легко ламається.","def_ru":"Остеопороз - состояние, когда костная ткань слабеет и легко ломается.","n":127},{"id":"patella","cat":"Skelettet","sv":"knäskål","la":"patella","uk":"наколінок","ru":"надколенник","def_sv":"Knäskålen är ett litet ben som skyddar knäleden framifrån.","def_uk":"Наколінок - невелика кістка, що захищає колінний суглоб спереду.","def_ru":"Надколенник - небольшая кость, защищающая коленный сустав спереди.","n":128},{"id":"periosteum","cat":"Skelettet","sv":"benhinna (periost)","la":"periosteum","uk":"окістя","ru":"надкостница","def_sv":"Benhinnan är ett tunt skikt som täcker benet och ger näring.","def_uk":"Окістя - тонка оболонка, що вкриває кістку та живить її.","def_ru":"Надкостница - тонкая оболочка, покрывающая кость и питающая её.","n":129},{"id":"phalanx","cat":"Skelettet","sv":"falang (finger- och tåben)","la":"phalanx","uk":"фаланга","ru":"фаланга","def_sv":"Falangerna är de små benen i fingrar och tår.","def_uk":"Фаланги - дрібні кістки пальців рук і ніг.","def_ru":"Фаланги - мелкие кости пальцев рук и ног.","n":130},{"id":"radius","cat":"Skelettet","sv":"strålben","la":"radius","uk":"променева кістка","ru":"лучевая кость","def_sv":"Strålbenet är underarmens ben på tumsidan.","def_uk":"Променева кістка - кістка передпліччя з боку великого пальця.","def_ru":"Лучевая кость - кость предплечья со стороны большого пальца.","n":131},{"id":"scapula","cat":"Skelettet","sv":"skulderblad","la":"scapula","uk":"лопатка","ru":"лопатка","def_sv":"Skulderbladet är ett platt ben på ryggens övre del.","def_uk":"Лопатка - плоска кістка у верхній частині спини.","def_ru":"Лопатка - плоская кость в верхней части спины.","n":132},{"id":"sternum","cat":"Skelettet","sv":"bröstben","la":"sternum","uk":"грудина","ru":"грудина","def_sv":"Bröstbenet ligger mitt framtill och de flesta revben fäster i det.","def_uk":"Грудина лежить спереду посередині, до неї кріпиться більшість ребер.","def_ru":"Грудина лежит спереди посередине, к ней крепится большинство рёбер.","n":133},{"id":"substantia-compacta","cat":"Skelettet","sv":"kompakt benvävnad (kompakta)","la":"substantia compacta","uk":"компактна речовина","ru":"компактное вещество","def_sv":"Kompakt benvävnad är benets hårda yttre skikt.","def_uk":"Компактна речовина - твердий зовнішній шар кістки.","def_ru":"Компактное вещество - твёрдый наружный слой кости.","n":134},{"id":"substantia-spongiosa","cat":"Skelettet","sv":"spongiös benvävnad (svampben)","la":"substantia spongiosa","uk":"губчаста речовина","ru":"губчатое вещество","def_sv":"Spongiös benvävnad är benets porösa inre del med benbalkar.","def_uk":"Губчаста речовина - пориста внутрішня частина кістки з кістковими балками.","def_ru":"Губчатое вещество - пористая внутренняя часть кости с костными балками.","n":135},{"id":"talus","cat":"Skelettet","sv":"språngben","la":"talus","uk":"надп'яткова кістка (таранна кістка)","ru":"таранная кость","def_sv":"Språngbenet förbinder underbenet med foten i fotleden.","def_uk":"Надп'яткова кістка з'єднує гомілку зі стопою в надп'ятково-гомілковому суглобі.","def_ru":"Таранная кость соединяет голень со стопой в голеностопном суставе.","n":136},{"id":"tibia","cat":"Skelettet","sv":"skenben","la":"tibia","uk":"великогомілкова кістка","ru":"большеберцовая кость","def_sv":"Skenbenet är underbenets kraftiga ben på insidan.","def_uk":"Великогомілкова кістка - міцна кістка гомілки з внутрішнього боку.","def_ru":"Большеберцовая кость - крепкая кость голени с внутренней стороны.","n":137},{"id":"ulna","cat":"Skelettet","sv":"armbågsben","la":"ulna","uk":"ліктьова кістка","ru":"локтевая кость","def_sv":"Armbågsbenet är underarmens ben på lillfingersidan.","def_uk":"Ліктьова кістка - кістка передпліччя з боку мізинця.","def_ru":"Локтевая кость - кость предплечья со стороны мизинца.","n":138},{"id":"vertebra-cervicalis","cat":"Skelettet","sv":"halskota (cervikalkota)","la":"vertebra cervicalis","uk":"шийний хребець","ru":"шейный позвонок","def_sv":"Halskotorna är sju stycken och bär upp huvudet.","def_uk":"Шийних хребців сім, вони підтримують голову.","def_ru":"Шейных позвонков семь, они поддерживают голову.","n":139},{"id":"vertebra-lumbalis","cat":"Skelettet","sv":"ländkota (lumbalkota)","la":"vertebra lumbalis","uk":"поперековий хребець","ru":"поясничный позвонок","def_sv":"Ländkotorna är fem stycken och är ryggradens kraftigaste kotor.","def_uk":"Поперекових хребців п'ять, вони найміцніші хребці хребта.","def_ru":"Поясничных позвонков пять, они самые массивные позвонки позвоночника.","n":140},{"id":"vertebra-thoracica","cat":"Skelettet","sv":"bröstkota (torakalkota)","la":"vertebra thoracica","uk":"грудний хребець","ru":"грудной позвонок","def_sv":"Bröstkotorna är tolv stycken och ledar mot revbenen.","def_uk":"Грудних хребців дванадцять, вони з'єднуються з ребрами.","def_ru":"Грудных позвонков двенадцать, они соединяются с рёбрами.","n":141},{"id":"abductio","cat":"Leder och muskler","sv":"abduktion (utåtföring)","la":"abductio","uk":"відведення (абдукція)","ru":"отведение (абдукция)","def_sv":"Abduktion är att föra en kroppsdel bort från kroppens mittlinje.","def_uk":"Відведення — це рух частини тіла від серединної лінії тіла.","def_ru":"Отведение — это движение части тела от срединной линии тела.","n":142},{"id":"adductio","cat":"Leder och muskler","sv":"adduktion (inåtföring)","la":"adductio","uk":"приведення (аддукція)","ru":"приведение (аддукция)","def_sv":"Adduktion är att föra en kroppsdel mot kroppens mittlinje.","def_uk":"Приведення — це рух частини тіла до серединної лінії тіла.","def_ru":"Приведение — это движение части тела к срединной линии тела.","n":143},{"id":"amphiarthrosis","cat":"Leder och muskler","sv":"amfiartros (halvrörlig fog)","la":"amphiarthrosis","uk":"амфіартроз (напіврухоме з'єднання)","ru":"амфиартроз (полуподвижное соединение)","def_sv":"En halvrörlig fog som bara tillåter små rörelser, till exempel mellan kotkropparna.","def_uk":"Напіврухоме з'єднання, яке допускає лише невеликі рухи, наприклад між тілами хребців.","def_ru":"Полуподвижное соединение, допускающее лишь небольшие движения, например между телами позвонков.","n":144},{"id":"articulatio","cat":"Leder och muskler","sv":"led","la":"articulatio","uk":"суглоб","ru":"сустав","def_sv":"En led är förbindelsen där två eller flera ben möts och rörelse sker.","def_uk":"Суглоб — це з'єднання, де сходяться дві або більше кісток і відбувається рух.","def_ru":"Сустав — это соединение, где сходятся две или более костей и происходит движение.","n":145},{"id":"articulatio-coxae","cat":"Leder och muskler","sv":"höftled","la":"articulatio coxae","uk":"кульшовий суглоб","ru":"тазобедренный сустав","def_sv":"Höftleden förbinder lårbenet med bäckenet och bär kroppens tyngd.","def_uk":"Кульшовий суглоб з'єднує стегнову кістку з тазом і несе вагу тіла.","def_ru":"Тазобедренный сустав соединяет бедренную кость с тазом и несёт вес тела.","n":146},{"id":"articulatio-cubiti","cat":"Leder och muskler","sv":"armbågsled","la":"articulatio cubiti","uk":"ліктьовий суглоб","ru":"локтевой сустав","def_sv":"Armbågsleden böjer och sträcker armen mellan överarm och underarm.","def_uk":"Ліктьовий суглоб згинає та розгинає руку між плечем і передпліччям.","def_ru":"Локтевой сустав сгибает и разгибает руку между плечом и предплечьем.","n":147},{"id":"articulatio-ellipsoidea","cat":"Leder och muskler","sv":"ellipsoidled (äggled)","la":"articulatio ellipsoidea","uk":"еліпсоподібний суглоб","ru":"эллипсовидный сустав","def_sv":"Led där en äggformad ledyta rör sig i en oval grop, som i handleden.","def_uk":"Суглоб, у якому яйцеподібна головка рухається в овальній ямці, як у променево-зап'ястковому суглобі.","def_ru":"Сустав, в котором яйцевидная головка движется в овальной ямке, как в лучезапястном суставе.","n":148},{"id":"articulatio-genus","cat":"Leder och muskler","sv":"knäled","la":"articulatio genus","uk":"колінний суглоб","ru":"коленный сустав","def_sv":"Knäleden ligger mellan lårben och skenben och böjer benet.","def_uk":"Колінний суглоб лежить між стегновою та великогомілковою кістками і згинає ногу.","def_ru":"Коленный сустав лежит между бедренной и большеберцовой костями и сгибает ногу.","n":149},{"id":"articulatio-humeri","cat":"Leder och muskler","sv":"axelled","la":"articulatio humeri","uk":"плечовий суглоб","ru":"плечевой сустав","def_sv":"Axelleden sitter mellan skulderbladet och överarmsbenet och rör sig åt alla håll.","def_uk":"Плечовий суглоб розташований між лопаткою та плечовою кісткою і рухається в усіх напрямках.","def_ru":"Плечевой сустав расположен между лопаткой и плечевой костью и движется во всех направлениях.","n":150},{"id":"articulatio-plana","cat":"Leder och muskler","sv":"planled (glidled)","la":"articulatio plana","uk":"плоский суглоб","ru":"плоский сустав","def_sv":"Led med nästan flata ledytor som glider mot varandra, till exempel mellan handlovsbenen.","def_uk":"Суглоб з майже рівними поверхнями, які ковзають одна по одній, наприклад між кістками зап'ястка.","def_ru":"Сустав с почти ровными поверхностями, скользящими друг по другу, например между костями запястья.","n":151},{"id":"articulatio-sellaris","cat":"Leder och muskler","sv":"sadelled","la":"articulatio sellaris","uk":"сідлоподібний суглоб","ru":"седловидный сустав","def_sv":"Led där båda ledytorna är sadelformade, som i tummens grundled.","def_uk":"Суглоб, де обидві поверхні мають форму сідла, як у суглобі великого пальця.","def_ru":"Сустав, где обе поверхности имеют форму седла, как в суставе большого пальца.","n":152},{"id":"articulatio-spheroidea","cat":"Leder och muskler","sv":"kulled","la":"articulatio spheroidea","uk":"кулястий суглоб","ru":"шаровидный сустав","def_sv":"Led där ett kulformat ledhuvud rör sig i en skål och tillåter rörelse åt alla håll, som i axelleden.","def_uk":"Суглоб, у якому куляста головка рухається в западині й дозволяє рухи в усіх напрямках, як у плечовому суглобі.","def_ru":"Сустав, в котором шаровидная головка движется во впадине и допускает движения во всех направлениях, как в плечевом суставе.","n":153},{"id":"articulatio-talocruralis","cat":"Leder och muskler","sv":"fotled (övre språngbensleden)","la":"articulatio talocruralis","uk":"надп'ятково-гомілковий суглоб","ru":"голеностопный сустав","def_sv":"Fotleden ligger mellan underbenet och språngbenet och lyfter foten.","def_uk":"Надп'ятково-гомілковий суглоб лежить між гомілкою та надп'ятковою кісткою і піднімає стопу.","def_ru":"Голеностопный сустав лежит между голенью и таранной костью и поднимает стопу.","n":154},{"id":"articulatio-trochoidea","cat":"Leder och muskler","sv":"vridled (trissled)","la":"articulatio trochoidea","uk":"обертовий суглоб","ru":"вращательный сустав","def_sv":"Led där ett ben roterar kring sin egen längdaxel, som mellan strålbenet och armbågsbenet.","def_uk":"Суглоб, у якому кістка обертається навколо власної поздовжньої осі, як між променевою та ліктьовою кістками.","def_ru":"Сустав, в котором кость вращается вокруг собственной продольной оси, как между лучевой и локтевой костями.","n":155},{"id":"bursa","cat":"Leder och muskler","sv":"slemsäck","la":"bursa","uk":"синовіальна сумка","ru":"синовиальная сумка","def_sv":"En slemsäck ligger som en dyna mellan sena och ben.","def_uk":"Синовіальна сумка лежить як подушка між сухожилком і кісткою.","def_ru":"Синовиальная сумка лежит как подушка между сухожилием и костью.","n":156},{"id":"capsula-articularis","cat":"Leder och muskler","sv":"ledkapsel","la":"capsula articularis","uk":"суглобова капсула","ru":"суставная капсула","def_sv":"Ledkapseln omsluter leden och håller ledvätskan på plats.","def_uk":"Суглобова капсула оточує суглоб і утримує синовіальну рідину на місці.","def_ru":"Суставная капсула окружает сустав и удерживает синовиальную жидкость на месте.","n":157},{"id":"cartilago-articularis","cat":"Leder och muskler","sv":"ledbrosk","la":"cartilago articularis","uk":"суглобовий хрящ","ru":"суставной хрящ","def_sv":"Ledbrosket täcker benändarna i leden och minskar friktion vid rörelse.","def_uk":"Суглобовий хрящ покриває кінці кісток у суглобі та зменшує тертя під час руху.","def_ru":"Суставной хрящ покрывает концы костей в суставе и уменьшает трение при движении.","n":158},{"id":"diaphragma","cat":"Leder och muskler","sv":"mellangärdet (diafragma)","la":"diaphragma","uk":"діафрагма","ru":"диафрагма","def_sv":"Mellangärdet skiljer bröstkorgen från buken och styr andningen.","def_uk":"Діафрагма відділяє грудну клітку від живота і керує диханням.","def_ru":"Диафрагма отделяет грудную клетку от живота и управляет дыханием.","n":159},{"id":"diarthrosis","cat":"Leder och muskler","sv":"diartros (fritt rörlig led)","la":"diarthrosis","uk":"діартроз (рухоме з'єднання)","ru":"диартроз (подвижное соединение)","def_sv":"En fritt rörlig led med ledhåla, ledkapsel och ledvätska, till exempel axelleden.","def_uk":"Вільно рухоме з'єднання із суглобовою порожниною, капсулою та синовіальною рідиною, наприклад плечовий суглоб.","def_ru":"Свободно подвижное соединение с суставной полостью, капсулой и синовиальной жидкостью, например плечевой сустав.","n":160},{"id":"extensio","cat":"Leder och muskler","sv":"extension (sträckning)","la":"extensio","uk":"розгинання (екстензія)","ru":"разгибание (экстензия)","def_sv":"Extension betyder att sträcka en kroppsdel så att vinkeln ökar.","def_uk":"Розгинання означає випрямляти частину тіла так, що кут збільшується.","def_ru":"Разгибание означает выпрямлять часть тела так, что угол увеличивается.","n":161},{"id":"flexio","cat":"Leder och muskler","sv":"flexion (böjning)","la":"flexio","uk":"згинання (флексія)","ru":"сгибание (флексия)","def_sv":"Flexion betyder att böja en kroppsdel så att vinkeln minskar.","def_uk":"Згинання означає згинати частину тіла так, що кут зменшується.","def_ru":"Сгибание означает сгибать часть тела так, что угол уменьшается.","n":162},{"id":"ginglymus","cat":"Leder och muskler","sv":"gångjärnsled","la":"ginglymus","uk":"блокоподібний суглоб","ru":"блоковидный сустав","def_sv":"Led som bara böjer och sträcker i ett plan, som armbågsleden.","def_uk":"Суглоб, який згинається і розгинається лише в одній площині, як ліктьовий суглоб.","def_ru":"Сустав, который сгибается и разгибается только в одной плоскости, как локтевой сустав.","n":163},{"id":"gomphosis","cat":"Leder och muskler","sv":"gomfos (tappfog)","la":"gomphosis","uk":"гомфоз (вклинення)","ru":"гомфоз (вколачивание)","def_sv":"Fog där en tand sitter fast i sitt tandfäste i käkbenet.","def_uk":"З'єднання, у якому зуб закріплений у комірці щелепи.","def_ru":"Соединение, при котором зуб закреплён в лунке челюсти.","n":164},{"id":"junctura-cartilaginea","cat":"Leder och muskler","sv":"broskfog","la":"junctura cartilaginea","uk":"хрящове з'єднання","ru":"хрящевое соединение","def_sv":"Fog där benen förenas av brosk och rörligheten är liten.","def_uk":"З'єднання, у якому кістки сполучені хрящем і рухливість незначна.","def_ru":"Соединение, в котором кости связаны хрящом и подвижность невелика.","n":165},{"id":"junctura-fibrosa","cat":"Leder och muskler","sv":"fibrös fog (bindvävsfog)","la":"junctura fibrosa","uk":"волокнисте з'єднання","ru":"фиброзное соединение","def_sv":"Fog där benen hålls samman av tät bindväv utan ledhåla.","def_uk":"З'єднання, у якому кістки утримуються щільною сполучною тканиною без суглобової порожнини.","def_ru":"Соединение, в котором кости удерживаются плотной соединительной тканью без суставной полости.","n":166},{"id":"ligamentum","cat":"Leder och muskler","sv":"ledband","la":"ligamentum","uk":"зв'язка","ru":"связка","def_sv":"Ett ledband är stark bindväv som håller ihop två ben.","def_uk":"Зв'язка — це міцна сполучна тканина, яка з'єднує дві кістки.","def_ru":"Связка — это прочная соединительная ткань, которая соединяет две кости.","n":167},{"id":"meniscus","cat":"Leder och muskler","sv":"menisk","la":"meniscus","uk":"меніск","ru":"мениск","def_sv":"Menisken är en broskskiva i knäleden som dämpar och stabiliserar.","def_uk":"Меніск — це хрящова пластинка в колінному суглобі, яка амортизує та стабілізує.","def_ru":"Мениск — это хрящевая пластинка в коленном суставе, которая амортизирует и стабилизирует.","n":168},{"id":"musculus-biceps-brachii","cat":"Leder och muskler","sv":"biceps (tvåhövdade armmuskeln)","la":"musculus biceps brachii","uk":"двоголовий м'яз плеча","ru":"двуглавая мышца плеча","def_sv":"Biceps ligger på överarmens framsida och böjer armbågen.","def_uk":"Двоголовий м'яз плеча лежить на передній поверхні плеча і згинає лікоть.","def_ru":"Двуглавая мышца плеча лежит на передней поверхности плеча и сгибает локоть.","n":169},{"id":"musculus-biceps-femoris","cat":"Leder och muskler","sv":"tvåhövdade lårmuskeln","la":"musculus biceps femoris","uk":"двоголовий м'яз стегна","ru":"двуглавая мышца бедра","def_sv":"Tvåhövdade lårmuskeln ligger på lårets baksida och böjer knäet.","def_uk":"Двоголовий м'яз стегна лежить на задній поверхні стегна і згинає коліно.","def_ru":"Двуглавая мышца бедра лежит на задней поверхности бедра и сгибает колено.","n":170},{"id":"musculus-deltoideus","cat":"Leder och muskler","sv":"deltamuskel","la":"musculus deltoideus","uk":"дельтоподібний м'яз","ru":"дельтовидная мышца","def_sv":"Deltamuskeln ligger över axeln och lyfter armen ut från kroppen.","def_uk":"Дельтоподібний м'яз лежить над плечовим суглобом і відводить руку від тулуба.","def_ru":"Дельтовидная мышца лежит над плечевым суставом и отводит руку от туловища.","n":171},{"id":"musculus-erector-spinae","cat":"Leder och muskler","sv":"ryggsträckaren","la":"musculus erector spinae","uk":"м'яз-випрямляч хребта","ru":"мышца, выпрямляющая позвоночник","def_sv":"Ryggsträckaren löper längs ryggraden och håller kroppen upprätt.","def_uk":"М'яз-випрямляч хребта проходить уздовж хребта і тримає тіло прямо.","def_ru":"Мышца, выпрямляющая позвоночник, проходит вдоль позвоночника и держит тело прямо.","n":172},{"id":"musculus-gastrocnemius","cat":"Leder och muskler","sv":"vadmuskeln","la":"musculus gastrocnemius","uk":"литковий м'яз","ru":"икроножная мышца","def_sv":"Vadmuskeln ligger på vadens baksida och lyfter hälen vid gång.","def_uk":"Литковий м'яз лежить на задній поверхні гомілки і піднімає п'яту під час ходьби.","def_ru":"Икроножная мышца лежит на задней поверхности голени и поднимает пятку при ходьбе.","n":173},{"id":"musculus-gluteus-maximus","cat":"Leder och muskler","sv":"stora sätesmuskeln","la":"musculus gluteus maximus","uk":"великий сідничний м'яз","ru":"большая ягодичная мышца","def_sv":"Stora sätesmuskeln bildar skinkan och sträcker höften vid gång.","def_uk":"Великий сідничний м'яз утворює сідницю і розгинає стегно під час ходьби.","def_ru":"Большая ягодичная мышца образует ягодицу и разгибает бедро при ходьбе.","n":174},{"id":"musculus-latissimus-dorsi","cat":"Leder och muskler","sv":"breda ryggmuskeln","la":"musculus latissimus dorsi","uk":"найширший м'яз спини","ru":"широчайшая мышца спины","def_sv":"Breda ryggmuskeln täcker nedre ryggen och drar armen bakåt.","def_uk":"Найширший м'яз спини покриває нижню частину спини і тягне руку назад.","def_ru":"Широчайшая мышца спины покрывает нижнюю часть спины и тянет руку назад.","n":175},{"id":"musculus-pectoralis-major","cat":"Leder och muskler","sv":"stora bröstmuskeln","la":"musculus pectoralis major","uk":"великий грудний м'яз","ru":"большая грудная мышца","def_sv":"Stora bröstmuskeln täcker bröstkorgens framsida och för armen inåt.","def_uk":"Великий грудний м'яз покриває передню поверхню грудної клітки і приводить руку.","def_ru":"Большая грудная мышца покрывает переднюю поверхность грудной клетки и приводит руку.","n":176},{"id":"musculus-quadriceps-femoris","cat":"Leder och muskler","sv":"fyrhövdade lårmuskeln","la":"musculus quadriceps femoris","uk":"чотириголовий м'яз стегна","ru":"четырёхглавая мышца бедра","def_sv":"Fyrhövdade lårmuskeln ligger på lårets framsida och sträcker knäet.","def_uk":"Чотириголовий м'яз стегна лежить на передній поверхні стегна і розгинає коліно.","def_ru":"Четырёхглавая мышца бедра лежит на передней поверхности бедра и разгибает колено.","n":177},{"id":"musculus-rectus-abdominis","cat":"Leder och muskler","sv":"raka bukmuskeln","la":"musculus rectus abdominis","uk":"прямий м'яз живота","ru":"прямая мышца живота","def_sv":"Raka bukmuskeln löper längs magen och böjer bålen framåt.","def_uk":"Прямий м'яз живота проходить уздовж живота і згинає тулуб уперед.","def_ru":"Прямая мышца живота проходит вдоль живота и сгибает туловище вперёд.","n":178},{"id":"musculus-sphincter","cat":"Leder och muskler","sv":"ringmuskel (slutmuskel)","la":"musculus sphincter","uk":"м'яз-замикач (сфінктер)","ru":"мышца-сжиматель (сфинктер)","def_sv":"En ringmuskel sluter en kroppsöppning, till exempel vid ändtarmen.","def_uk":"М'яз-замикач закриває отвір тіла, наприклад біля прямої кишки.","def_ru":"Мышца-сжиматель закрывает отверстие тела, например у прямой кишки.","n":179},{"id":"musculus-trapezius","cat":"Leder och muskler","sv":"kappmuskeln","la":"musculus trapezius","uk":"трапецієподібний м'яз","ru":"трапециевидная мышца","def_sv":"Kappmuskeln sträcker sig över nacke och rygg och lyfter axlarna.","def_uk":"Трапецієподібний м'яз простягається по шиї та спині і піднімає плечі.","def_ru":"Трапециевидная мышца простирается по шее и спине и поднимает плечи.","n":180},{"id":"musculus-triceps-brachii","cat":"Leder och muskler","sv":"triceps (trehövdade armmuskeln)","la":"musculus triceps brachii","uk":"триголовий м'яз плеча","ru":"трёхглавая мышца плеча","def_sv":"Triceps ligger på överarmens baksida och sträcker armbågen.","def_uk":"Триголовий м'яз плеча лежить на задній поверхні плеча і розгинає лікоть.","def_ru":"Трёхглавая мышца плеча лежит на задней поверхности плеча и разгибает локоть.","n":181},{"id":"pronatio","cat":"Leder och muskler","sv":"pronation","la":"pronatio","uk":"пронація","ru":"пронация","def_sv":"Pronation är att vrida underarmen så att handflatan vänds nedåt.","def_uk":"Пронація — це поворот передпліччя так, що долоня повертається вниз.","def_ru":"Пронация — это поворот предплечья так, что ладонь поворачивается вниз.","n":182},{"id":"rotatio","cat":"Leder och muskler","sv":"rotation (vridning)","la":"rotatio","uk":"обертання (ротація)","ru":"вращение (ротация)","def_sv":"Rotation är att vrida en kroppsdel runt sin egen längdaxel.","def_uk":"Обертання — це поворот частини тіла навколо власної поздовжньої осі.","def_ru":"Вращение — это поворот части тела вокруг собственной продольной оси.","n":183},{"id":"supinatio","cat":"Leder och muskler","sv":"supination","la":"supinatio","uk":"супінація","ru":"супинация","def_sv":"Supination är att vrida underarmen så att handflatan vänds uppåt.","def_uk":"Супінація — це поворот передпліччя так, що долоня повертається вгору.","def_ru":"Супинация — это поворот предплечья так, что ладонь поворачивается вверх.","n":184},{"id":"sutura","cat":"Leder och muskler","sv":"sutur (skallsöm)","la":"sutura","uk":"шов (черепний шов)","ru":"шов (черепной шов)","def_sv":"Söm mellan skallbenen där benkanterna griper in i varandra och nästan ingen rörelse sker.","def_uk":"Шов між кістками черепа, де краї кісток заходять одне в одне й рух майже відсутній.","def_ru":"Шов между костями черепа, где края костей заходят друг за друга и движение почти отсутствует.","n":185},{"id":"symphysis","cat":"Leder och muskler","sv":"fog (symfys)","la":"symphysis","uk":"симфіз (напівсуглоб)","ru":"симфиз (полусустав)","def_sv":"En fog är en förbindelse där två ben hålls samman av fibröst brosk och bara kan röra sig obetydligt, till exempel blygdbensfogen.","def_uk":"Симфіз — це з'єднання, де дві кістки утримуються волокнистим хрящем і майже не рухаються, наприклад лобковий симфіз.","def_ru":"Симфиз — это соединение, где две кости удерживаются волокнистым хрящом и почти не двигаются, например лобковый симфиз.","n":186},{"id":"synarthrosis","cat":"Leder och muskler","sv":"synartros (orörlig fog)","la":"syna и та ковтати.","def_ru":"Язык чувствует вкус и помогает жевать и глотать.","n":288},{"id":"metabolismus","cat":"Matsmältningsorganen","sv":"ämnesomsättning (metabolism)","la":"metabolismus","uk":"обмін речовин (метаболізм)","ru":"обмен веществ (метаболизм)","def_sv":"Ämnesomsättning är kroppens alla kemiska processer för energi och uppbyggnad.","def_uk":"Обмін речовин - це всі хімічні процеси тіла для енергії та побудови.","def_ru":"Обмен веществ - это все химические процессы тела для энергии и построения.","n":289},{"id":"oesophagus","cat":"Matsmältningsorganen","sv":"matstrupe","la":"oesophagus","uk":"стравохід","ru":"пищевод","def_sv":"Matstrupen transporterar maten från svalget ner till magsäcken.","def_uk":"Стравохід переносить їжу з глотки вниз до шлунка.","def_ru":"Пищевод переносит пищу из глотки вниз в желудок.","n":290},{"id":"pancreas","cat":"Matsmältningsorganen","sv":"bukspottkörtel","la":"pancreas","uk":"підшлункова залоза","ru":"поджелудочная железа","def_sv":"Bukspottkörteln bildar matsmältningsenzymer och hormonet insulin.","def_uk":"Підшлункова залоза виробляє травні ферменти і гормон інсулін.","def_ru":"Поджелудочная железа вырабатывает пищеварительные ферменты и гормон инсулин.","n":291},{"id":"peristalsis","cat":"Matsmältningsorganen","sv":"peristaltik","la":"peristalsis","uk":"перистальтика","ru":"перистальтика","def_sv":"Peristaltik är vågformade muskelrörelser som för maten framåt.","def_uk":"Перистальтика - це хвилеподібні рухи м'язів, які просувають їжу вперед.","def_ru":"Перистальтика - это волнообразные движения мышц, продвигающие пищу вперёд.","n":292},{"id":"peritoneum","cat":"Matsmältningsorganen","sv":"bukhinna","la":"peritoneum","uk":"очеревина","ru":"брюшина","def_sv":"Bukhinnan är hinnan som klär buken och täcker organen.","def_uk":"Очеревина - це оболонка, яка вистилає живіт і вкриває органи.","def_ru":"Брюшина - это оболочка, которая выстилает живот и покрывает органы.","n":293},{"id":"pylorus","cat":"Matsmältningsorganen","sv":"portvakt","la":"pylorus","uk":"воротар (пілорус)","ru":"привратник (пилорус)","def_sv":"Portvakten är muskeln som släpper ut maginnehållet i tolvfingertarmen.","def_uk":"Воротар - це м'яз, який випускає вміст шлунка у дванадцятипалу кишку.","def_ru":"Привратник - это мышца, которая выпускает содержимое желудка в двенадцатиперстную кишку.","n":294},{"id":"rectum","cat":"Matsmältningsorganen","sv":"ändtarm","la":"rectum","uk":"пряма кишка","ru":"прямая кишка","def_sv":"Ändtarmen samlar avföringen innan den töms ut.","def_uk":"Пряма кишка збирає кал перед його виведенням.","def_ru":"Прямая кишка собирает кал перед его выведением.","n":295},{"id":"resorptio","cat":"Matsmältningsorganen","sv":"upptag (resorption)","la":"resorptio","uk":"всмоктування (резорбція)","ru":"всасывание (резорбция)","def_sv":"Resorption är när näring tas upp från tarmen till blodet.","def_uk":"Резорбція - це всмоктування поживних речовин із кишківника в кров.","def_ru":"Резорбция - это всасывание питательных веществ из кишечника в кровь.","n":296},{"id":"vesica-biliaris","cat":"Matsmältningsorganen","sv":"gallblåsa","la":"vesica biliaris","uk":"жовчний міхур","ru":"жёлчный пузырь","def_sv":"Gallblåsan lagrar galla och tömmer den i tolvfingertarmen.","def_uk":"Жовчний міхур накопичує жовч і виділяє її у дванадцятипалу кишку.","def_ru":"Жёлчный пузырь накапливает жёлчь и выделяет её в двенадцатиперстную кишку.","n":297},{"id":"villi-intestinales","cat":"Matsmältningsorganen","sv":"tarmludd (villi)","la":"villi intestinales","uk":"кишкові ворсинки","ru":"кишечные ворсинки","def_sv":"Tarmludd är små utskott som ökar tunntarmens upptagsyta.","def_uk":"Кишкові ворсинки - це маленькі вирости, що збільшують всисну поверхню тонкої кишки.","def_ru":"Кишечные ворсинки - это маленькие выросты, увеличивающие всасывающую поверхность тонкой кишки.","n":298},{"id":"aequilibrium-aquae-et-electrolytorum","cat":"Urinorganen","sv":"vätske- och elektrolytbalans","la":"aequilibrium aquae et electrolytorum","uk":"водно-електролітний баланс","ru":"водно-электролитный баланс","def_sv":"Vätske- och elektrolytbalans är jämvikt mellan vatten och salter.","def_uk":"Водно-електролітний баланс - це рівновага між водою та солями.","def_ru":"Водно-электролитный баланс - это равновесие между водой и солями.","n":299},{"id":"catheter-urinarius","cat":"Urinorganen","sv":"urinkateter","la":"catheter urinarius","uk":"сечовий катетер","ru":"мочевой катетер","def_sv":"En urinkateter är en tunn slang som tömmer urinblåsan.","def_uk":"Сечовий катетер - це тонка трубка, що випорожнює сечовий міхур.","def_ru":"Мочевой катетер - это тонкая трубка, опорожняющая мочевой пузырь.","n":300},{"id":"cortex-renalis","cat":"Urinorganen","sv":"njurbark","la":"cortex renalis","uk":"кіркова речовина нирки","ru":"корковое вещество почки","def_sv":"Njurbarken är njurens yttre del där blodet filtreras.","def_uk":"Кіркова речовина є зовнішньою частиною нирки, де фільтрується кров.","def_ru":"Корковое вещество - наружная часть почки, где фильтруется кровь.","n":301},{"id":"diuresis","cat":"Urinorganen","sv":"diures (urinmängd)","la":"diuresis","uk":"діурез","ru":"диурез","def_sv":"Diures är mängden urin som bildas under en tid.","def_uk":"Діурез - це кількість сечі, утвореної за певний час.","def_ru":"Диурез - это количество мочи, образованной за определённое время.","n":302},{"id":"filtratio","cat":"Urinorganen","sv":"filtration","la":"filtratio","uk":"фільтрація","ru":"фильтрация","def_sv":"Filtration är när vätska pressas ur blodet i glomerulus.","def_uk":"Фільтрація - це витиснення рідини з крові у клубочку.","def_ru":"Фильтрация - это выдавливание жидкости из крови в клубочке.","n":303},{"id":"glomerulus","cat":"Urinorganen","sv":"glomerulus (kärlnystan)","la":"glomerulus","uk":"клубочок","ru":"клубочек","def_sv":"I glomerulus filtreras blodet till primärurin.","def_uk":"У клубочку кров фільтрується у первинну сечу.","def_ru":"В клубочке кровь фильтруется в первичную мочу.","n":304},{"id":"incontinentia-urinae","cat":"Urinorganen","sv":"urininkontinens","la":"incontinentia urinae","uk":"нетримання сечі","ru":"недержание мочи","def_sv":"Urininkontinens är ofrivilligt läckage av urin.","def_uk":"Нетримання сечі - це мимовільне витікання сечі.","def_ru":"Недержание мочи - это непроизвольное подтекание мочи.","n":305},{"id":"medulla-renalis","cat":"Urinorganen","sv":"njurmärg","la":"medulla renalis","uk":"мозкова речовина нирки","ru":"мозговое вещество почки","def_sv":"Njurmärgen är njurens inre del med urinsamlande kanaler.","def_uk":"Мозкова речовина є внутрішньою частиною нирки із сечозбірними канальцями.","def_ru":"Мозговое вещество - внутренняя часть почки с собирательными трубочками.","n":306},{"id":"micturitio","cat":"Urinorganen","sv":"miktion (blåstömning)","la":"micturitio","uk":"сечовипускання","ru":"мочеиспускание","def_sv":"Miktion är att tömma urinblåsan.","def_uk":"Сечовипускання - це випорожнення сечового міхура.","def_ru":"Мочеиспускание - это опорожнение мочевого пузыря.","n":307},{"id":"nephronum","cat":"Urinorganen","sv":"nefron","la":"nephronum","uk":"нефрон","ru":"нефрон","def_sv":"Nefronet är njurens minsta enhet som bildar urin.","def_uk":"Нефрон - найменша одиниця нирки, яка утворює сечу.","def_ru":"Нефрон - наименьшая единица почки, образующая мочу.","n":308},{"id":"pelvis-renalis","cat":"Urinorganen","sv":"njurbäcken","la":"pelvis renalis","uk":"ниркова миска","ru":"почечная лоханка","def_sv":"Njurbäckenet samlar urinen innan den rinner till urinledaren.","def_uk":"Ниркова миска збирає сечу, перш ніж вона тече в сечовід.","def_ru":"Почечная лоханка собирает мочу перед её оттоком в мочеточник.","n":309},{"id":"ren","cat":"Urinorganen","sv":"njure","la":"ren","uk":"нирка","ru":"почка","def_sv":"Njuren renar blodet och bildar urin.","def_uk":"Нирка очищує кров і утворює сечу.","def_ru":"Почка очищает кровь и образует мочу.","n":310},{"id":"retentio-urinae","cat":"Urinorganen","sv":"urinretention","la":"retentio urinae","uk":"затримка сечі","ru":"задержка мочи","def_sv":"Urinretention är att blåsan inte kan tömmas normalt.","def_uk":"Затримка сечі - це неможливість нормально випорожнити міхур.","def_ru":"Задержка мочи - это невозможность нормально опорожнить пузырь.","n":311},{"id":"ureter","cat":"Urinorganen","sv":"urinledare","la":"ureter","uk":"сечовід","ru":"мочеточник","def_sv":"Urinledaren transporterar urin från njuren till urinblåsan.","def_uk":"Сечовід транспортує сечу від нирки до сечового міхура.","def_ru":"Мочеточник переносит мочу от почки к мочевому пузырю.","n":312},{"id":"urethra","cat":"Urinorganen","sv":"urinrör","la":"urethra","uk":"сечівник","ru":"мочеиспускательный канал","def_sv":"Urinröret leder urinen ut ur kroppen.","def_uk":"Сечівник виводить сечу назовні з тіла.","def_ru":"Мочеиспускательный канал выводит мочу наружу из тела.","n":313},{"id":"urina","cat":"Urinorganen","sv":"urin","la":"urina","uk":"сеча","ru":"моча","def_sv":"Urin är vätska med avfallsämnen som njurarna bildar.","def_uk":"Сеча - це рідина з відходами обміну, яку утворюють нирки.","def_ru":"Моча - это жидкость с продуктами обмена, образуемая почками.","n":314},{"id":"vesica-urinaria","cat":"Urinorganen","sv":"urinblåsa","la":"vesica urinaria","uk":"сечовий міхур","ru":"мочевой пузырь","def_sv":"Urinblåsan samlar och lagrar urin före tömning.","def_uk":"Сечовий міхур збирає та зберігає сечу до випорожнення.","def_ru":"Мочевой пузырь собирает и хранит мочу до опорожнения.","n":315},{"id":"cicatrix","cat":"Huden","sv":"ärr","la":"cicatrix","uk":"рубець","ru":"рубец","def_sv":"Ett ärr är ny bindväv efter ett läkt sår.","def_uk":"Рубець - це нова сполучна тканина після загоєної рани.","def_ru":"Рубец - это новая соединительная ткань после зажившей раны.","n":316},{"id":"cutis","cat":"Huden","sv":"hud","la":"cutis","uk":"шкіра","ru":"кожа","def_sv":"Huden skyddar kroppen mot skador, smitta och uttorkning.","def_uk":"Шкіра захищає тіло від ушкоджень, інфекцій та зневоднення.","def_ru":"Кожа защищает тело от повреждений, инфекций function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pool(){ return DATA.filter(d=>state.cats.has(d.cat)); }

function buildSelects(){
  const f=$("front"); f.innerHTML="";
  for(const k in LANGS){ const o=document.createElement("option"); o.value=k; o.textContent=LANGS[k]; f.appendChild(o); }
  f.value=state.front;
  const d=$("deflang"); d.innerHTML="";
  for(const k in DEFLANGS){ const o=document.createElement("option"); o.value=k; o.textContent=DEFLANGS[k]; d.appendChild(o); }
  d.value=state.def;
  const u=$("ui"); u.innerHTML="";
  for(const k in UILANGS){ const o=document.createElement("option"); o.value=k;
    o.textContent=UILANGS[k]; u.appendChild(o); }
  u.value=state.ui;
}

function buildBackChips(){
  const c=$("backs"); c.innerHTML="";
  for(const k in LANGS){
    if(k===state.front) continue;
    const b=document.createElement("span");
    b.className="chip"+(state.backs.includes(k)?" on":"");
    b.textContent=LANGS[k];
    b.onclick=()=>{
      const i=state.backs.indexOf(k);
      if(i>=0){ if(state.backs.filter(x=>x!==state.front).length>1) state.backs.splice(i,1); }
      else state.backs.push(k);
      buildBackChips(); render();
    };
    c.appendChild(b);
  }
}

function buildCatChips(){
  const c=$("cats"); c.innerHTML="";
  const cats=[...new Set(DATA.map(d=>d.cat))];
  for(const cat of cats){
    const n=DATA.filter(d=>d.cat===cat).length;
    const b=document.createElement("span");
    b.className="chip"+(state.cats.has(cat)?" on":"");
    b.textContent=catName(cat)+" ("+n+")";
    b.onclick=()=>{ state.cats.has(cat)?state.cats.delete(cat):state.cats.add(cat);
      buildCatChips(); resetQueue(); render(); };
    c.appendChild(b);
  }
  $("count").textContent=pool().length+" / "+DATA.length;
}
